<title>Штаб фуд-корта 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#BFDDF1; --surface:#E1F0FA; --surface-2:#D3E8F6; --surface-3:#C2DBEE;
  --line:rgba(36,23,21,.16); --line-soft:rgba(36,23,21,.09);
  --text:#241715; --muted:#4E3D39; --muted-2:#8A7873;
  --accent:#B7DC1E; --accent-dim:rgba(183,220,30,.32); --accent-ink:#41500A;
  --pink:#FF6FD8; --pink-ink:#A32478;
  --danger:#F52016; --info:#1273B8;
  --mute-bg:rgba(36,23,21,.08); --mute-ink:#6B5A56;
  --grid:rgba(36,23,21,.09);
  --btn-ink:#1A1310;
  --shadow:0 1px 0 rgba(36,23,21,.06), 0 8px 26px rgba(18,60,100,.10);
  /* тепловая шкала: лаймовый → жёлтый → оранжевый → красный */
  --h0:rgba(36,23,21,.17);  --h0i:#5C4B47;   /* не начата */
  --h1:#B7DC1E;             --h1i:#3C4A08;   /* в графике */
  --h2:#F2C230;             --h2i:#5A4405;   /* внимание  */
  --h3:#F08A1E;             --h3i:#6B3703;   /* риск      */
  --h4:#F52016;             --h4i:#FFFFFF;   /* просрочка */
  --hD:#7FB80A;             --hDi:#FFFFFF;   /* готово    */
  /* проекты */
  --pA:#1273B8; --pA-soft:rgba(18,115,184,.14);
  --pB:#C2408F; --pB-soft:rgba(255,111,216,.20);
  --pS:#4E3D39; --pS-soft:rgba(78,61,57,.12);
  --r:16px; --r-sm:10px;
  --font:'Inter','Helvetica Neue',Arial,sans-serif;
  --font-display:'Pavliuchenko','Pavliuchenko Trial','Arial Black','Helvetica Neue',Impact,sans-serif;
  --rc-RAZ:#241715;    --ri-RAZ:#F1F2F6;
  --rc-GASTRO:#2266BC; --ri-GASTRO:#FFFFFF;
  --rc-MKT:#C2408F;    --ri-MKT:#FFFFFF;
  --rc-IT:#4A3AA7;     --ri-IT:#FFFFFF;
  --rc-HOST:#0E7A55;   --ri-HOST:#FFFFFF;
  --rc-FIN:#A5691A;    --ri-FIN:#FFFFFF;
  --mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0B0D; --surface:#141416; --surface-2:#1A1A1D; --surface-3:#232327;
  --line:#2C2C33; --line-soft:#212126;
  --text:#F4F4F6; --muted:#96969F; --muted-2:#6A6A74;
  --accent:#C8E82D; --accent-dim:rgba(200,232,45,.16); --accent-ink:#C8E82D;
  --pink:#FF6FD8; --pink-ink:#FF6FD8;
  --danger:#FF3B2F; --info:#6EA8FF;
  --mute-bg:rgba(255,255,255,.07); --mute-ink:#96969F;
  --grid:rgba(255,255,255,.05);
  --btn-ink:#0D0D0D;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --h0:rgba(255,255,255,.13); --h0i:#A9A9B4;
  --h1:#C8E82D; --h1i:#12160A;
  --h2:#F2C230; --h2i:#1A1405;
  --h3:#F08A1E; --h3i:#1A0D02;
  --h4:#FF3B2F; --h4i:#FFFFFF;
  --hD:#9BD11B; --hDi:#12160A;
  --pA:#6EA8FF; --pA-soft:rgba(110,168,255,.16);
  --pB:#FF6FD8; --pB-soft:rgba(255,111,216,.16);
  --pS:#B9B9C2; --pS-soft:rgba(255,255,255,.10);
  --rc-RAZ:#D8CFC9;    --ri-RAZ:#10121A;
  --rc-GASTRO:#4A93E8; --ri-GASTRO:#10121A;
  --rc-MKT:#D95FA8;    --ri-MKT:#10121A;
  --rc-IT:#8A72E0;     --ri-IT:#10121A;
  --rc-HOST:#1FAE7C;   --ri-HOST:#10121A;
  --rc-FIN:#BE8420;    --ri-FIN:#10121A;

}}
:root[data-theme="dark"]{
  --bg:#0B0B0D; --surface:#141416; --surface-2:#1A1A1D; --surface-3:#232327;
  --line:#2C2C33; --line-soft:#212126;
  --text:#F4F4F6; --muted:#96969F; --muted-2:#6A6A74;
  --accent:#C8E82D; --accent-dim:rgba(200,232,45,.16); --accent-ink:#C8E82D;
  --pink:#FF6FD8; --pink-ink:#FF6FD8;
  --danger:#FF3B2F; --info:#6EA8FF;
  --mute-bg:rgba(255,255,255,.07); --mute-ink:#96969F;
  --grid:rgba(255,255,255,.05);
  --btn-ink:#0D0D0D;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.45);
  --h0:rgba(255,255,255,.13); --h0i:#A9A9B4;
  --h1:#C8E82D; --h1i:#12160A;
  --h2:#F2C230; --h2i:#1A1405;
  --h3:#F08A1E; --h3i:#1A0D02;
  --h4:#FF3B2F; --h4i:#FFFFFF;
  --hD:#9BD11B; --hDi:#12160A;
  --pA:#6EA8FF; --pA-soft:rgba(110,168,255,.16);
  --pB:#FF6FD8; --pB-soft:rgba(255,111,216,.16);
  --pS:#B9B9C2; --pS-soft:rgba(255,255,255,.10);
  --rc-RAZ:#D8CFC9;    --ri-RAZ:#10121A;
  --rc-GASTRO:#4A93E8; --ri-GASTRO:#10121A;
  --rc-MKT:#D95FA8;    --ri-MKT:#10121A;
  --rc-IT:#8A72E0;     --ri-IT:#10121A;
  --rc-HOST:#1FAE7C;   --ri-HOST:#10121A;
  --rc-FIN:#BE8420;    --ri-FIN:#10121A;

}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:var(--font);background:var(--bg);color:var(--text);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- каркас ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:2px;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{padding:4px 10px 16px;display:flex;flex-direction:column;gap:3px}
.brand b{font-family:var(--font-display);font-size:19px;line-height:1.05;letter-spacing:-.02em;text-transform:uppercase}
.brand span{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:500;color:var(--muted);text-align:left;transition:background .12s,color .12s}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button[aria-current="true"]{background:var(--text);color:var(--bg);font-weight:600}
.nav .cnt{margin-left:auto;font-size:11px;font-variant-numeric:tabular-nums;
  background:var(--mute-bg);color:var(--mute-ink);padding:1px 6px;border-radius:20px;font-weight:600}
.nav button[aria-current="true"] .cnt{background:rgba(255,255,255,.2);color:inherit}
.nav .cnt.hot{background:var(--danger);color:#fff}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:8px}
.me{display:flex;align-items:center;gap:9px;width:100%;padding:8px;border-radius:var(--r-sm);
  background:var(--surface-2);text-align:left}
.me:hover{background:var(--surface-3)}
.me .av{min-width:30px;padding:0 6px;height:30px;border-radius:9px;display:grid;place-items:center;flex:0 0 auto;
  font-weight:800;font-size:11px;color:var(--btn-ink);background:var(--accent)}
.me .who{min-width:0}
.me .who b{display:block;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{display:block;font-size:10.5px;color:var(--muted-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{font-size:11px;color:var(--muted-2);display:flex;gap:8px;align-items:center;padding:0 2px}
.mini button{font-size:11px;color:var(--muted-2);text-decoration:underline;text-underline-offset:2px}
.mini button:hover{color:var(--text)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);flex:0 0 auto}
.dot.live{background:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,.2)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line);
  padding:14px 26px;display:flex;align-items:center;gap:26px;flex-wrap:wrap}
.tb-title h1{font-family:var(--font-display);font-size:21px;letter-spacing:-.01em;text-transform:uppercase;line-height:1.1}
.tb-title p{font-size:12px;color:var(--muted-2);margin-top:2px}
.tb-stats{display:flex;gap:22px;margin-left:auto;flex-wrap:wrap}
.tb-stat{display:flex;flex-direction:column;gap:2px;min-width:76px}
.tb-stat span{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);font-weight:600}
.tb-stat b{font-family:var(--font-display);font-size:22px;line-height:1;font-variant-numeric:tabular-nums}
.tb-stat b.a{color:var(--pA)} .tb-stat b.b{color:var(--pB)}
.view{padding:24px 26px 64px;max-width:1420px}
.view[hidden]{display:none}

/* ---------- общие блоки ---------- */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card>h3, .sec-h{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:12px}
.sec-h.row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.grid{display:grid;gap:14px}
.btn{padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;background:var(--text);color:var(--bg);transition:opacity .12s}
.btn:hover{opacity:.85}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--surface-2);opacity:1}
.btn.lime{background:var(--accent);color:var(--btn-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px}
select,input[type=text],input[type=week],textarea{background:var(--surface);border:1px solid var(--line);
  border-radius:9px;padding:7px 10px;font-size:13px}
textarea{resize:vertical;line-height:1.5}
.av{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 5px;border-radius:7px;
  font-size:10px;font-weight:800;letter-spacing:.02em;flex:0 0 auto}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;
  font-size:11px;font-weight:600;background:var(--mute-bg);color:var(--mute-ink);white-space:nowrap}
.pill.a{background:var(--pA-soft);color:var(--pA)}
.pill.b{background:var(--pB-soft);color:var(--pB)}
.pill.s{background:var(--pS-soft);color:var(--pS)}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
.empty{padding:28px;text-align:center;color:var(--muted-2);font-size:13px;
  border:1px dashed var(--line);border-radius:var(--r)}
.bar{height:7px;border-radius:20px;background:var(--mute-bg);overflow:hidden}
.bar i{display:block;height:100%;border-radius:20px;background:var(--accent);transition:width .35s ease}
.scroll-x{overflow-x:auto;overscroll-behavior-x:contain}
.fig{width:100%;height:auto;display:block;overflow:visible}
.fig text{font-family:var(--font)}
.figcap{font-size:12px;color:var(--muted-2);line-height:1.5;margin-top:10px;max-width:76ch}
.ask{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:4px}
.ptable{width:100%;border-collapse:collapse;font-size:13px}
.ptable th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);
  font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptable td{padding:10px;border-bottom:1px solid var(--line-soft);vertical-align:top;min-width:0}
.ptable tr:last-child td{border-bottom:0}
.ptable td.w{width:34%}
.ptable .num{white-space:nowrap}
.two > *{min-width:0}
.nav h4{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted-2);
  font-weight:800;padding:12px 11px 5px}
.nav h4:first-child{padding-top:2px}

/* оргструктура */
.orgwrap{position:relative}
.orgfig .onode{cursor:pointer}
.orgfig .onode:hover rect:first-of-type{stroke:var(--text);stroke-width:1.6}
.orgfig .onode:focus{outline:none}
.orgfig .onode:focus rect:first-of-type{stroke:var(--info);stroke-width:2}
.ocard{position:absolute;z-index:20;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:14px;box-shadow:0 16px 44px rgba(12,30,60,.22);font-size:12.5px}
.orgwrap{padding-bottom:6px}
.ocard-in{display:flex;flex-direction:column;gap:10px}
.oc-h{display:flex;gap:10px;align-items:center}
.oc-h .av{min-width:34px;padding:0 7px;height:34px;border-radius:10px;font-size:11px}
.oc-h b{display:block;font-size:13.5px;line-height:1.25}
.oc-h span{display:block;font-size:11px;color:var(--muted-2)}
.oc-tags{display:flex;gap:5px;flex-wrap:wrap}
.oc-row{display:flex;flex-direction:column;gap:2px}
.oc-row b{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2)}
.oc-row span{font-size:12.5px;line-height:1.45}
.oc-res b{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:6px}
.oc-res ul{margin-left:16px;display:flex;flex-direction:column;gap:4px}
.oc-res li{font-size:12.5px;line-height:1.45}
.oc-res li::marker{color:var(--accent-ink)}

/* нагрузка */
.lgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;position:relative}
.lpanel{border:1px solid var(--line-soft);border-radius:12px;padding:11px 11px 5px;background:var(--surface-2);min-width:0}
.lp-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.lp-h b{font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lp-h .num{font-size:11px;color:var(--muted-2);font-weight:700}
.loadfig{width:100%;height:78px;cursor:crosshair}
.ltip{position:absolute;z-index:30;pointer-events:none;background:var(--text);color:var(--bg);
  padding:7px 10px;border-radius:8px;font-size:11.5px;line-height:1.45;box-shadow:0 8px 22px rgba(0,0,0,.28)}
.findings{margin-left:18px;display:flex;flex-direction:column;gap:9px}
.findings li{font-size:13.5px;line-height:1.55}
.findings li::marker{font-weight:800;color:var(--accent-ink)}
.hrgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px}
.hrgrid>div>b{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:8px}
.hrgrid ul,.hrgrid ol{margin-left:17px;display:flex;flex-direction:column;gap:6px}
.hrgrid li{font-size:12.8px;line-height:1.5}

/* вакансии */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:14px;align-items:start}
.vac{background:var(--surface);border:1px solid var(--line-soft);border-left:4px solid var(--h2);
  border-radius:var(--r);padding:17px;box-shadow:var(--shadow);min-width:0}
.vac.crit{border-left-color:var(--danger)} .vac.high{border-left-color:var(--h3)}
.v-h{display:flex;gap:11px;align-items:flex-start;margin-bottom:10px}
.v-h .av{min-width:36px;padding:0 7px;height:36px;border-radius:10px;font-size:11.5px}
.v-h h4{font-size:15.5px;line-height:1.25;margin-bottom:6px}
.v-tags{display:flex;gap:5px;flex-wrap:wrap}
.v-why{font-size:12.8px;color:var(--muted);line-height:1.55;margin-bottom:13px}
.v-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.v-grid>div{min-width:0}
.v-grid b{font-size:9.8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:6px}
.v-grid ul{margin-left:15px;display:flex;flex-direction:column;gap:4px}
.v-grid li{font-size:12.2px;line-height:1.45}
.v-pay{margin-top:13px;padding-top:12px;border-top:1px solid var(--line-soft)}
.v-pay b{font-size:9.8px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);display:block;margin-bottom:4px}
.v-pay span{font-size:13.5px;font-weight:700}
@media (max-width:560px){.v-grid{grid-template-columns:1fr}}

/* маркетинг */
.pcard{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px;min-width:0}
.pcard b{font-size:12.5px;display:block;margin-bottom:6px}
.pcard p{font-size:12.8px;color:var(--muted);line-height:1.55}
.acard{border-left:3px solid var(--line);padding-left:11px}
.acard b{font-size:12.8px;display:block;margin-bottom:2px}
.acard span{font-size:12.3px;color:var(--muted);line-height:1.5}
.clist2{margin-left:16px;display:flex;flex-direction:column;gap:5px}
.clist2 li{font-size:12.5px;line-height:1.5}
.grid > *{min-width:0}
</style>
<style>
/* ---------- дашборд ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:15px 16px;
  display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);font-weight:700}
.kpi .val{font-family:var(--font-display);font-size:34px;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .sub{font-size:11.5px;color:var(--muted-2)}
.kpi.acc{border-left:4px solid var(--pA)}
.kpi.acb{border-left:4px solid var(--pB)}
.kpi.warn .val{color:var(--h3)}
.kpi.bad .val{color:var(--danger)}
.two{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;align-items:start}
.phase-row{display:grid;grid-template-columns:1fr 46px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.phase-row:last-child{border-bottom:0}
.phase-row .nm{font-size:13px;font-weight:500;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.phase-row .pc{text-align:right;font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted-2);margin-top:12px;align-items:center}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- дорожная карта (гант) ---------- */
.gantt{border:1px solid var(--line-soft);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.gwrap{overflow-x:auto}
.ginner{min-width:1180px}
.ghead{display:grid;position:sticky;top:0;z-index:5;background:var(--surface-2);border-bottom:1px solid var(--line)}
.ghead>div{padding:9px 6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted-2);border-left:1px solid var(--line-soft);text-align:center}
.ghead>div:first-child{text-align:left;padding-left:16px;border-left:0}
.ghead .mo.now{background:var(--accent-dim);color:var(--accent-ink)}
.grp{padding:11px 16px 8px;background:var(--surface-2);border-top:1px solid var(--line);
  font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;display:flex;gap:9px;align-items:center}
.grp .pc{margin-left:auto;font-family:var(--mono);color:var(--muted)}
.grow{display:grid;border-top:1px solid var(--line-soft);align-items:center;min-height:38px}
.grow:hover{background:var(--surface-2)}

/* ---------- разворачиваем в экземпляры ---------- */
const INST = [];
for(const t of TASKS){
  if(t.sc==='season'){
    INST.push({id:'S'+t.i, n:t.i, p:'S', ph:t.ph, st:t.st, r:t.r, t:t.t, h:t.h, dep:t.dep||[], mrg:t.mrg,
               start:d_(t.s), end:d_(t.e)});
  } else {
    for(const pk of ['A','B']){
      const D0 = PROJECTS[pk].date;
      INST.push({id:pk+t.i, n:t.i, p:pk, ph:t.ph, st:t.st, r:t.r, t:t.t, h:t.h, dep:t.dep||[], mrg:t.mrg,
                 start:addD(D0,t.s), end:addD(D0,t.e)});
    }
  }
}
const BYID = Object.fromEntries(INST.map(x=>[x.id,x]));
const depInst = (inst,n)=>BYID[inst.p+n] || BYID['S'+n] || null;

/* ---------- горизонт ---------- */
const T0 = d_('2026-09-01');
const T1 = INST.reduce((m,x)=>x.end>m?x.end:m, T0);
const TEND = new Date(T1.getFullYear(), T1.getMonth()+1, 1);
const SPAN = days(T0,TEND);
const MONTHS = (()=>{const a=[]; let c=new Date(T0.getFullYear(),T0.getMonth(),1);
  while(c<TEND){ a.push(new Date(c)); c=new Date(c.getFullYear(),c.getMonth()+1,1);} return a;})();
function pct(d){
  let i = MONTHS.findIndex(m=>m.getFullYear()===d.getFullYear() && m.getMonth()===d.getMonth());
  if(i<0) i = d < MONTHS[0] ? 0 : MONTHS.length-1;
  const m0=MONTHS[i], dim=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();
  const frac=Math.max(0,Math.min(1,(d.getDate()-1)/dim));
  return Math.max(0, Math.min(100, (i+frac)/MONTHS.length*100));
}

<script>
/* =========================================================================
   ХРАНИЛИЩЕ: общая база артефакта, с откатом на локальную память
   ========================================================================= */
const LS = {
  get(k,f){ try{const v=localStorage.getItem('fc27.'+k); return v?JSON.parse(v):f;}catch(e){return f;} },
  set(k,v){ try{localStorage.setItem('fc27.'+k, JSON.stringify(v));}catch(e){} }
};

const Store = {
  db:null, online:false, tasks:{}, roster:{}, ai:{}, subs:[],
  onChange(fn){ this.subs.push(fn); },
  fire(){ this.subs.forEach(f=>{try{f();}catch(e){console.error(e);}}); },

  async init(){
    try{ this.db = await claude.use('db'); }catch(e){ this.db=null; }
    if(!this.db){
      this.tasks  = LS.get('tasks',{});
      this.roster = LS.get('roster',{});
      this.ai     = LS.get('ai',{});
      this.online = false; setSync(false); this.fire(); return;
    }
    this.online = true; setSync(true);
    this.db.collection('tasks').onSnapshot(snap=>{
      const next={}; snap.docs.forEach(d=>{ next[d.id]=d.data()||{}; });
      this.tasks=next; this.fire();
    }, e=>{ setSync(false, e.code); });
    this.db.doc('meta/roster').onSnapshot(d=>{ this.roster=(d.exists?d.data():{})||{}; this.fire(); }, ()=>{});
    this.db.doc('meta/ai').onSnapshot(d=>{ this.ai=(d.exists?d.data():{})||{}; this.fire(); }, ()=>{});
  },

  task(id){ return this.tasks[id] || {p:0, blocked:false, note:'', by:'', at:''}; },

  async saveTask(id, patch){
    const cur = this.task(id);
    const next = Object.assign({}, cur, patch, {at:new Date().toISOString(), by: Me.label()});
    this.tasks = Object.assign({}, this.tasks, {[id]:next});
    this.fire();
    if(this.db){ try{ await this.db.doc('tasks/'+id).set(next); }catch(e){ setSync(false, e.code); } }
    else LS.set('tasks', this.tasks);
  },

  async saveRoster(roleId, patch){
    const next = Object.assign({}, this.roster, {[roleId]: Object.assign({}, this.roster[roleId]||{}, patch)});
    this.roster = next; this.fire();
    if(this.db){ try{ await this.db.doc('meta/roster').set(next); }catch(e){ setSync(false, e.code); } }
    else LS.set('roster', next);
  },

  async saveAI(key, val){
    const next = Object.assign({}, this.ai, {[key]:val});
    const plans = Object.keys(next).filter(k=>k.startsWith('plan:')).sort();
    while(plans.length > 24) delete next[plans.shift()];
    this.ai = next; this.fire();
    if(this.db){ try{ await this.db.doc('meta/ai').set(next); }catch(e){ setSync(false, e.code); } }
    else LS.set('ai', next);
  },

  chatRef(roleId){ return this.db ? this.db.collection('chats/'+roleId+'/msgs') : null; }
};

function setSync(ok, code){
  const dot=document.getElementById('syncDot'), txt=document.getElementById('syncTxt');
  if(!dot) return;
  dot.classList.toggle('live', !!ok);
  txt.textContent = ok ? 'общая база · синхронно' : (code ? 'офлайн · '+code : 'локальный режим');
  txt.title = ok ? 'Изменения видят все участники команды сразу'
                 : 'Общая база недоступна — прогресс сохраняется только в этом браузере';
}

/* ---------- личность ---------- */
const Me = {
  id: (r=>ROLE[r]?r:null)(LS.get('me', null)),
  role(){ return this.id ? ROLE[this.id] : null; },
  label(){ const r=this.role(); if(!r) return 'Не представился';
           return (Store.roster[r.id]&&Store.roster[r.id].name) || r.name || r.n; },
  set(id){ this.id=id; LS.set('me',id); paintMe(); render(); }

function nameOf(roleId){
  const r=ROLE[roleId]; if(!r) return '';
  return (Store.roster[roleId]&&Store.roster[roleId].name) || r.name || '';

/* =========================================================================
   ПРОГРЕСС И ТЕПЛО
   ========================================================================= */
const HEAT = {
  done:  {bg:'var(--hD)', ink:'var(--hDi)', l:'готово',      w:0},
  none:  {bg:'var(--h0)', ink:'var(--h0i)', l:'не начата',   w:1},
  ahead: {bg:'var(--h1)', ink:'var(--h1i)', l:'с опережением',w:0},
  ok:    {bg:'var(--h1)', ink:'var(--h1i)', l:'в графике',   w:1},
  warn:  {bg:'var(--h2)', ink:'var(--h2i)', l:'внимание',    w:2},
  risk:  {bg:'var(--h3)', ink:'var(--h3i)', l:'отставание',  w:3},
  late:  {bg:'var(--h4)', ink:'var(--h4i)', l:'просрочено',  w:4},
  block: {bg:'var(--h4)', ink:'var(--h4i)', l:'заблокировано',w:4}
};
function heatKey(inst){
  const s = Store.task(inst.id);
  if((s.p||0) >= 100) return 'done';
  if(s.blocked) return 'block';
  if(today > inst.end) return 'late';
  if(today < inst.start) return (s.p||0) > 0 ? 'ahead' : 'none';
  const span = Math.max(1, days(inst.start, inst.end));
  const exp  = Math.round(days(inst.start, today)/span*100);
  const gap  = exp - (s.p||0);
  if(gap <= 10) return 'ok';
  if(gap <= 30) return 'warn';
  return 'risk';
}
const prog = list => list.length ? Math.round(list.reduce((s,x)=>s+(Store.task(x.id).p||0),0)/list.length) : 0;
const byProj  = p => INST.filter(x=>x.p===p);
const byRole  = r => INST.filter(x=>x.r===r);
const isLate  = x => heatKey(x)==='late';
const isBlocked = x => heatKey(x)==='block';
const activeNow = x => today>=x.start && today<=x.end && (Store.task(x.id).p||0)<100;
const overlaps = (x,a,b) => x.start<=b && x.end>=a;

/* проектный прогресс: БАЗА входит в оба города */
function projProgress(p){ return prog(INST.filter(x=>x.p===p || x.p==='S')); }

/* =========================================================================
   ДВИЖОК РИСКОВ — правила, считаются на каждом изменении
   ========================================================================= */
function computeRisks(){
  const R=[];
  const add=(lvl,title,desc,fixes,tag)=>R.push({lvl,title,desc,fixes,tag});

  /* 1. просроченные */
  const late = INST.filter(x=>heatKey(x)==='late');
  if(late.length){
    const byP = {A:0,B:0,S:0}; late.forEach(x=>byP[x.p]++);
    add('crit', `Просрочено: ${nTask(late.length)}`,
      `Срок вышел, задача не закрыта. Москва — ${byP.A}, Петербург — ${byP.B}, БАЗА — ${byP.S}. ` +
      `Самая старая просрочка: «${late.sort((a,b)=>a.end-b.end)[0].t}» (${fmtL(late[0].end)}).`,
      ['Собрать 30-минутный разбор по каждой просрочке: перенос срока или снятие задачи.',
       'Просрочки на критическом пути (договоры → въезд → заезд) закрывать первыми, остальное двигать.',
       'Зафиксировать новый срок в карте — иначе задача уходит из поля зрения.'], 'сроки');
  }

  /* 2. заблокированные */
  const blocked = INST.filter(x=>Store.task(x.id).blocked && (Store.task(x.id).p||0)<100);
  if(blocked.length) add('crit', `Заблокировано: ${nTask(blocked.length)}`,
    blocked.slice(0,4).map(x=>`«${x.t}» — ${ROLE[x.r].n}`).join('; ') + (blocked.length>4?' и др.':''),
    ['Вывести блокеры на ближайшую статусную встречу — у них нет владельца внутри команды.',
     'На каждый блокер назначить эскалацию: кто и до какого числа снимает.'], 'блокеры');

  /* 3. отставание от плана */
  const behind = INST.filter(x=>heatKey(x)==='risk');
  if(behind.length) add('high', `Отставание от графика: ${nTask(behind.length)}`,
    `Задачи идут, но темп ниже плана более чем на 30%. В зоне риска: ` +
    behind.slice(0,3).map(x=>`«${x.t.slice(0,60)}…» (${ROLE[x.r].n})`).join('; ') + '.',
    ['Разбить задачу на недельные шаги и вести в бэклоге, а не одним куском.',
     'Проверить, не ждёт ли исполнитель данных от смежника — чаще всего отстают задачи со входом извне.',
     'Если ресурса нет — передать часть объёма другой роли или подрядчику.'], 'темп');

  /* 4. нарушенные зависимости */
  const brokenDeps=[];
  INST.forEach(x=>{
    if(today < x.start) return;
    if((Store.task(x.id).p||0) >= 100) return;
    x.dep.forEach(n=>{ const d=depInst(x,n);
      if(d && (Store.task(d.id).p||0) < 100) brokenDeps.push([x,d]); });
  });
  if(brokenDeps.length) add('high', `Стартовали без предшественника: ${brokenDeps.length}`,
    brokenDeps.slice(0,3).map(([x,d])=>`«${x.t.slice(0,50)}…» началась, но «${d.t.slice(0,50)}…» ещё не закрыта`).join('; ')+'.',
    ['Проверить, можно ли идти параллельно; если нет — остановить и не тратить ресурс.',
     'Поднять приоритет предшественника: он держит цепочку.'], 'зависимости');

  /* 5. ресурсный конфликт двух городов */
  const conflicts=[];
  ROLES.forEach(r=>{
    const a = INST.filter(x=>x.r===r.id && x.p==='A' && activeNow(x));
    const b = INST.filter(x=>x.r===r.id && x.p==='B' && activeNow(x));
    if(a.length && b.length) conflicts.push({r, a:a.length, b:b.length});
  });
  if(conflicts.length) add('high', `Один человек тянет оба города: ${plural(conflicts.length,'роль','роли','ролей')}`,
    conflicts.map(c=>`${c.r.n} — ${c.a} задач по Москве и ${c.b} по Петербургу одновременно`).join('; ')+'.',
    ['Развести пики: у Петербурга запас 49 дней, часть подготовки можно сдвинуть на после 20 июня.',
     'Ввести дублёра на роль во втором городе — минимум на фазы заезда и площадки.',
     'Закрепить приоритет: город с ближней датой всегда важнее.'], 'ресурсы');

  /* 6. наложение фаз двух проектов */
  const aPost = INST.filter(x=>x.p==='A' && x.ph==='post');
  const bPrep = INST.filter(x=>x.p==='B' && x.ph==='prep');
  const ov = aPost.filter(x=>bPrep.some(y=>overlaps(y,x.start,x.end)));
  if(ov.length && today <= PROJECTS.B.date){
    const gap = days(PROJECTS.A.date, PROJECTS.B.date);
    add(today>=addD(PROJECTS.A.date,-30)?'crit':'med', 'Закрытие Москвы накладывается на финал Петербурга',
      `Между фестивалями ${gap} дней. Закрытие московского проекта (документооборот, смета, отчёт — ${aPost.length} задач) ` +
      `идёт ровно в те же недели, что и финальная подготовка Петербурга (${bPrep.length} задач: макеты, заезд, digital-меню).`,
      ['Сдвинуть отчётную презентацию и разбор Москвы на после 8 августа, оставив в июле только документы с жёстким сроком.',
       'Закрыть договоры и макеты Петербурга до 20 июня — до того, как команда уйдёт на площадку в Москве.',
       'На июль назначить отдельного ответственного за закрытие Москвы, не занятого в подготовке Петербурга.'], 'календарь');
  }

  /* 7. перегрузка роли на ближайшие 14 дней */
  const horizon = addD(today,14);
  ROLES.forEach(r=>{
    const load = INST.filter(x=>x.r===r.id && overlaps(x,today,horizon) && (Store.task(x.id).p||0)<100);
    if(load.length>=5) add('med', `Перегрузка: ${r.n}`,
      `${nTask(load.length)} не закрыто в ближайшие две недели: ` + load.slice(0,4).map(x=>`«${x.t.slice(0,45)}…»`).join(', ')+'.',
      ['Сформировать бэклог недели и оставить в работе не более трёх задач одновременно.',
       'Часть площадочных задач передать на хостинг-менеджмент, часть документов — на финансового менеджера.'], 'нагрузка');
  });

  /* 8. незакрытые роли */
  const noName = ROLES.filter(r=>!nameOf(r.id) && byRole(r.id).some(x=>overlaps(x,today,addD(today,60))));
  if(noName.length) add('med', `Роли без исполнителя: ${noName.length}`,
    `На ближайшие два месяца задачи есть, а имени в команде нет: ` + noName.map(r=>r.n).join(', ')+'.',
    ['Закрыть роли до старта продаж — иначе задачи повиснут на директоре по развитию.',
     'Если роль не выделяется в штат, оформить её как совмещение и указать это в команде.'], 'команда');

  /* 9. критический путь до заезда */
  ['A','B'].forEach(pk=>{
    const contract = BYID[pk+'p8'], entry = BYID[pk+'p12'];
    if(!contract||!entry) return;
    const dLeft = days(today, contract.end);
    const p = Store.task(contract.id).p||0;
    if(dLeft <= 60 && dLeft > -30 && p < 100)
      add(dLeft<=20?'crit':'high', `Договоры ${PROJECTS[pk].name}: ${p}% за ${dLeft} дн. до срока`,
        `Без подписанных договоров нельзя запустить регламент заезда (${fmtL(entry.start)}), выпустить пропуска и печатать макеты с меню. ` +
        `Это самая длинная цепочка проекта: ПРОДАЖИ → ДОКУМЕНТЫ → ПРОИЗВОДСТВО → ПЛОЩАДКА.`,
        ['Разделить поток: типовые договоры подписывать по мере готовности, не ждать полного пула.',
         'Согласовать с юридическим отделом сокращённый регламент для повторных резидентов Клуба.',
         'Резидентам без договора за 40 дней до даты — стоп-лист и передача места из листа ожидания.'], 'критический путь');
  });

  const ord={crit:0,high:1,med:2,low:3};
  return R.sort((a,b)=>ord[a.lvl]-ord[b.lvl]);
}
</script>

<script>
/* =========================================================================
   ОТРИСОВКА
   ========================================================================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avatar = (roleId, cls)=>{ const r=ROLE[roleId];
  return `<span class="${cls||'av'}" style="background:var(--rc-${r.id});color:var(--ri-${r.id})">${r.ab}</span>`; };
const projPill = p=>`<span class="pill ${PROJECTS[p].cls}">${PROJECTS[p].short}</span>`;
const heatChip = k=>`<span class="pill" style="background:${HEAT[k].bg};color:${HEAT[k].ink}">${HEAT[k].l}</span>`;
const dl = x=>`${fmtS(x.start)} — ${fmtS(x.end)}`;
const plural = (n,a,b,c)=>{const t=n%10, h=n%100;
  return n+' '+(t===1&&h!==11 ? a : (t>=2&&t<=4&&(h<10||h>=20) ? b : c));};
const nTask = n=>plural(n,'задача','задачи','задач');

let VIEW = 'dash';
const TITLES = {
  dash:['Дашборд','Общий ход подготовки сезона'],
  scheme:['Схема процесса','Что за чем идёт и почему два города мешают друг другу'],
  road:['Дорожная карта','Сентябрь 2026 → сентябрь 2027, оба города на одной шкале'],
  heat:['Тепловая карта','Где горит: по ролям, по месяцам, по задачам'],
  backlog:['Бэклог недели','Что взять в работу на неделю каждому сотруднику'],
  risks:['Риски','Что уже мешает и что с этим делать'],
  chat:['Чаты','Переписка по задачам с каждой ролью'],
  team:['Команда','Роли, исполнители и их загрузка'],
  org:['Оргструктура','Кто кому подчиняется и что с кого спрашивать'],
  hr:['Нагрузка и найм','Сколько стоит каждая роль и кого нанимать'],
  mkt:['Маркетинг гастроблока','Стратегия спроса: резиденты и гости']
};

/* ---------- 1. ДАШБОРД ---------- */
function renderDash(){
  const all=prog(INST), late=INST.filter(isLate).length, act=INST.filter(activeNow).length;
  const risks=computeRisks(), crit=risks.filter(r=>r.lvl==='crit').length, blk=INST.filter(isBlocked).length;
  const dA=days(today,PROJECTS.A.date), dB=days(today,PROJECTS.B.date);
  const mine = Me.id ? byRole(Me.id).filter(x=>overlaps(x,today,addD(today,7)) && (Store.task(x.id).p||0)<100) : [];

  const kpi=(cls,lbl,val,sub)=>`<div class="kpi ${cls}"><span class="lbl">${lbl}</span>
      <span class="val">${val}</span><span class="sub">${sub}</span></div>`;

  const phaseRows = PHASES.map(f=>{
    const list=INST.filter(x=>x.ph===f.id), p=prog(list);
    const done=list.filter(x=>(Store.task(x.id).p||0)>=100).length;
    return `<div class="phase-row"><div>
        <div class="nm">${f.n}<span class="pill">${done}/${list.length}</span></div>
        <div class="bar"><i style="width:${p}%;background:${p>=100?'var(--hD)':'var(--accent)'}"></i></div>
      </div><div class="pc">${p}%</div></div>`;
  }).join('');

  const loadRows = ROLES.map(r=>{
    const list=byRole(r.id), open=list.filter(x=>(Store.task(x.id).p||0)<100 && overlaps(x,today,addD(today,30)));
    const worst=open.reduce((m,x)=>Math.max(m,HEAT[heatKey(x)].w),0);
    return {r, open:open.length, worst, p:prog(list)};
  }).filter(x=>x.open>0).sort((a,b)=>b.worst-a.worst||b.open-a.open).slice(0,8);

  $('#v-dash').innerHTML = `
    <div class="grid" style="gap:18px">
      <div class="kpis">
        ${kpi('','Готовность сезона',all+'%',`${INST.filter(x=>(Store.task(x.id).p||0)>=100).length} из ${INST.length} задач закрыто`)}
        ${kpi(blk?'bad':'','Блокеры', blk, blk?'ждут эскалации':'блокеров нет')}
        ${kpi('acc','Москва · 20 июня', projProgress('A')+'%', dA>0?`${dA} дней до площадки`:'фестиваль прошёл')}
        ${kpi('acb','Петербург · 8 авг', projProgress('B')+'%', dB>0?`${dB} дней до площадки`:'фестиваль прошёл')}
        ${kpi('','В работе сейчас', act, plural(act,'задача в активном окне','задачи в активном окне','задач в активном окне').replace(/^\d+\s/,''))}
        ${kpi(late?'bad':'','Просрочено', late, late?'требует решения сегодня':'график чистый')}
        ${kpi(crit?'bad':(risks.length?'warn':''),'Риски', risks.length, crit?plural(crit,'критический','критических','критических'):'критических нет')}
      </div>

      <div class="two">
        <div class="card">
          <h3>Готовность по фазам</h3>
          ${phaseRows}
          <div class="legend">
            <span><i style="background:var(--hD)"></i>готово</span>
            <span><i style="background:var(--h1)"></i>в графике</span>
            <span><i style="background:var(--h2)"></i>внимание</span>
            <span><i style="background:var(--h3)"></i>отставание</span>
            <span><i style="background:var(--h4)"></i>просрочка</span>
            <span><i style="background:var(--h0)"></i>не начата</span>
          </div>
        </div>

        <div class="card">
          <h3>Кто под нагрузкой · 30 дней</h3>
          <div style="display:flex;flex-direction:column;gap:9px">
            ${loadRows.length? loadRows.map(x=>`
              <div style="display:flex;gap:10px;align-items:center">
                ${avatar(x.r.id)}
                <div style="flex:1;min-width:0">
                  <div style="font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(x.r.n)}</div>
                  <div style="font-size:11px;color:var(--muted-2)">${esc(nameOf(x.r.id)||'исполнитель не назначен')}</div>
                </div>
                <span class="pill" style="background:${['var(--h0)','var(--h1)','var(--h2)','var(--h3)','var(--h4)'][x.worst]};color:${['var(--h0i)','var(--h1i)','var(--h2i)','var(--h3i)','var(--h4i)'][x.worst]}">${nTask(x.open)}</span>
              </div>`).join('')
            : '<div class="empty">В ближайший месяц открытых задач нет</div>'}
          </div>
        </div>
      </div>

      <div class="card">
        <div class="sec-h row"><span>Что горит прямо сейчас</span>
          <button class="btn ghost sm" data-go="risks">Все риски →</button></div>
        <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
          ${risks.slice(0,3).map(r=>`<div class="risk ${r.lvl}">
              <div class="rmeta"><span class="pill">${esc(r.tag)}</span>${lvlPill(r.lvl)}</div>
              <h4>${esc(r.title)}</h4><p>${esc(r.desc)}</p></div>`).join('')
            || '<div class="empty">Рисков не обнаружено — держите темп</div>'}
        </div>
      </div>

      ${Me.id?`<div class="card">
        <div class="sec-h row"><span>Моя неделя · ${esc(ROLE[Me.id].n)}</span>
          <button class="btn ghost sm" data-go="backlog">Открыть бэклог →</button></div>
        ${mine.length? `<div class="tlist">${mine.map(taskRow).join('')}</div>`
          : '<div class="empty">На этой неделе задач по вашей роли нет</div>'}
      </div>`:`<div class="note">Выберите свою роль слева внизу — появится личный бэклог, чат и авторство изменений.</div>`}
    </div>`;
}
const lvlPill = l=>({crit:'<span class="pill" style="background:var(--h4);color:var(--h4i)">критический</span>',
  high:'<span class="pill" style="background:var(--h3);color:var(--h3i)">высокий</span>',
  med:'<span class="pill" style="background:var(--h2);color:var(--h2i)">средний</span>',
  low:'<span class="pill">низкий</span>'}[l]||'');

function taskRow(x){
  const s=Store.task(x.id), k=heatKey(x);
  return `<div class="titem" style="border-left-color:${HEAT[k].bg}">
    <button class="chk" data-done="${x.id}" aria-pressed="${(s.p||0)>=100}" title="Отметить готовой">✓</button>
    <div><div class="tk">${esc(x.t)}</div>
      <div class="meta">${projPill(x.p)}<span class="num">${dl(x)}</span>
        ${avatar(x.r,'')}<span>${esc(ROLE[x.r].n)}</span>${heatChip(k)}
        ${s.blocked?'<span class="pill" style="background:var(--h4);color:var(--h4i)">блокер</span>':''}</div></div>
    <div class="rt"><div class="prog">${[0,25,50,75,100].map(v=>
        `<button data-set="${x.id}" data-p="${v}" aria-pressed="${(s.p||0)===v}">${v}</button>`).join('')}</div>
      <button class="btn ghost sm" data-open="${x.id}">Открыть</button></div>
  </div>`;
}

/* ---------- 2. СХЕМА ПРОЦЕССА ----------
   Иллюстрации нарисованы вручную во встроенном SVG: viewBox + width:100%,
   цвета — через переменные темы, у каждого узла свой id и <title>.        */
const stageTasks = st => INST.filter(x=>x.st===st);
const stageWorst = list => { let k='done', w=-1;
  list.forEach(x=>{ const h=heatKey(x); if(HEAT[h].w>w){ w=HEAT[h].w; k=h; } });
  return list.length?k:'none'; };

function figChain(){
  const W=1000, BW=145, GAP=20, X0=10, Y=46, BH=130;
  const flow = STAGES.filter(st=>st.id!=='st0');
  const boxes = flow.map((st,i)=>{
    const x = X0 + i*(BW+GAP);
    const list = stageTasks(st.id), p = prog(list), k = stageWorst(list);
    const openCnt = list.filter(x=>(Store.task(x.id).p||0)<100).length;
    const roles = ROLES.filter(r=>list.some(x=>x.r===r.id));
    let cx = x+12;
    const chips = roles.map(r=>{
      const w = 11 + r.ab.length*6.4, g =
        `<g><title>${esc(r.n)}${nameOf(r.id)?' — '+esc(nameOf(r.id)):''}</title>
          <rect x="${cx}" y="${Y+104}" width="${w}" height="16" rx="5" fill="var(--rc-${r.id})"></rect>
          <text x="${cx+w/2}" y="${Y+115}" font-size="9" font-weight="800" text-anchor="middle"
            fill="var(--ri-${r.id})">${r.ab}</text></g>`;
      cx += w+4; return g;
    }).join('');
    const arrow = i<flow.length-1 ? `<g opacity=".55">
        <line x1="${x+BW+3}" y1="${Y+BH/2}" x2="${x+BW+GAP-7}" y2="${Y+BH/2}"
          stroke="currentColor" stroke-width="1.5"></line>
        <path d="M${x+BW+GAP-8} ${Y+BH/2-4} L${x+BW+GAP-2} ${Y+BH/2} L${x+BW+GAP-8} ${Y+BH/2+4} Z" fill="currentColor"></path>
      </g>` : '';
    return `<g id="stage-${st.id}"><title>${esc(st.n)}: ${esc(st.out)}. Задач ${list.length}, открыто ${openCnt}, готовность ${p}%</title>
      <rect x="${x}" y="${Y}" width="${BW}" height="${BH}" rx="12"
        fill="var(--surface)" stroke="var(--line)" stroke-width="1"></rect>
      <path d="M${x} ${Y+12} a12 12 0 0 1 12 -12 h${BW-24} a12 12 0 0 1 12 12 v3 h-${BW} Z" fill="${HEAT[k].bg}"></path>
      <text x="${x+12}" y="${Y+26}" font-size="9.5" font-weight="800" letter-spacing="1"
        fill="var(--muted-2)">${String(i+1).padStart(2,'0')}</text>
      <text x="${x+12}" y="${Y+47}" font-size="12.5" font-weight="800" fill="currentColor">${esc(st.n)}</text>
      <text x="${x+12}" y="${Y+64}" font-size="10" fill="var(--muted-2)">${list.length} задач · ${openCnt} открыто</text>
      <text x="${x+12}" y="${Y+92}" font-size="21" font-weight="800" fill="currentColor">${p}%</text>
      <rect x="${x+12}" y="${Y+96}" width="${BW-24}" height="5" rx="3" fill="var(--h0)"></rect>
      <rect x="${x+12}" y="${Y+96}" width="${(BW-24)*p/100}" height="5" rx="3" fill="${HEAT[k].bg}"></rect>
      ${chips}</g>${arrow}`;
  }).join('');

  const cross = stageTasks('st0'), cp = prog(cross);
  const crossRoles = ROLES.filter(r=>cross.some(x=>x.r===r.id));
  let ccx = 690;
  const crossChips = crossRoles.map(r=>{ const w=11+r.ab.length*6.4;
    const g = `<g><title>${esc(r.n)}</title>
      <rect x="${ccx}" y="${Y+BH+43}" width="${w}" height="16" rx="5" fill="var(--rc-${r.id})"></rect>
      <text x="${ccx+w/2}" y="${Y+BH+54}" font-size="9" font-weight="800" text-anchor="middle"
        fill="var(--ri-${r.id})">${r.ab}</text></g>`;
    ccx += w+4; return g; }).join('');

  return `<svg class="fig" viewBox="0 0 ${W} ${Y+BH+90}" role="img"
      aria-label="Цепочка из шести стадий подготовки фуд-корта со сквозными процессами">
    <title>Производственная цепочка зоны фуд-корт</title>
    ${boxes}
    <g id="stage-st0"><title>Сквозные процессы: ${esc(STAGES[6].out)}. Готовность ${cp}%</title>
      <rect x="${X0}" y="${Y+BH+30}" width="${W-2*X0}" height="42" rx="10"
        fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="5 4"></rect>
      <text x="${X0+14}" y="${Y+BH+48}" font-size="11" font-weight="800" letter-spacing=".8"
        fill="var(--muted-2)">СКВОЗНЫЕ</text>
      <text x="${X0+14}" y="${Y+BH+63}" font-size="11" fill="currentColor">${esc(cross.length? 'Бюджет фуд-корта и статусные встречи — идут через весь проект':'')}</text>
      <text x="${W-X0-16}" y="${Y+BH+57}" font-size="16" font-weight="800" text-anchor="end" fill="currentColor">${cp}%</text>
      ${crossChips}</g>
  </svg>`;
}

function figCities(){
  const W=1000, PAD=10, sx = d => PAD + days(T0,d)/SPAN*(W-2*PAD);
  const span = list => list.length ? [list.reduce((m,x)=>x.start<m?x.start:m,list[0].start),
                                      list.reduce((m,x)=>x.end>m?x.end:m,list[0].end)] : null;
  const base = span(INST.filter(x=>x.p==='S'));
  const track = (pk,ph) => span(INST.filter(x=>x.p===pk && (ph==='prep'? (x.ph==='prep') : (x.ph==='live'||x.ph==='post'))));
  const rows = [
    {y:52,  lbl:'БАЗА · один раз на оба города', col:'var(--pS)',  seg:[base], ev:null},
    {y:112, lbl:'МОСКВА · Коломенское',          col:'var(--pA)',  seg:[track('A','prep'),track('A','post')], ev:PROJECTS.A.date, evl:'20.06'},
    {y:172, lbl:'ПЕТЕРБУРГ · Елагин парк',       col:'var(--pB)',  seg:[track('B','prep'),track('B','post')], ev:PROJECTS.B.date, evl:'08.08'}
  ];
  const aPost = track('A','post'), bPrep = track('B','prep');
  const ovA = aPost && bPrep ? new Date(Math.max(aPost[0],bPrep[0])) : null;
  const ovB = aPost && bPrep ? new Date(Math.min(aPost[1],bPrep[1])) : null;
  const overlap = (ovA && ovB && ovA<ovB) ? `<g id="overlap"><title>Закрытие Москвы и финальная подготовка Петербурга идут одновременно</title>
      <rect x="${sx(ovA)}" y="98" width="${sx(ovB)-sx(ovA)}" height="102" rx="6"
        fill="var(--danger)" opacity=".13"></rect>
      <rect x="${sx(ovA)}" y="98" width="${sx(ovB)-sx(ovA)}" height="102" rx="6"
        fill="none" stroke="var(--danger)" stroke-width="1" stroke-dasharray="4 3" opacity=".6"></rect>
      <text x="${(sx(ovA)+sx(ovB))/2}" y="215" font-size="10" font-weight="800" text-anchor="middle"
        fill="var(--danger)">НАЛОЖЕНИЕ ${days(ovA,ovB)} ДН.</text></g>` : '';

  const ticks = MONTHS.filter((m,i)=>i%2===0).map(m=>`
    <line x1="${sx(m)}" y1="30" x2="${sx(m)}" y2="196" stroke="var(--grid)" stroke-width="1"></line>
    <text x="${sx(m)}" y="240" font-size="9.5" text-anchor="middle" fill="var(--muted-2)">${MONTH_SHORT[m.getMonth()]} ${String(m.getFullYear()).slice(2)}</text>`).join('');

  const bars = rows.map(r=>{
    const segs = r.seg.filter(Boolean).map((sg,i)=>`<rect x="${sx(sg[0])}" y="${r.y}" width="${Math.max(3,sx(sg[1])-sx(sg[0]))}"
        height="22" rx="6" fill="${r.col}" opacity="${i?0.45:0.85}"></rect>`).join('');
    const ev = r.ev ? `<g><title>Дата фестиваля</title>
        <line x1="${sx(r.ev)}" y1="${r.y-8}" x2="${sx(r.ev)}" y2="${r.y+30}" stroke="${r.col}" stroke-width="2.5"></line>
        <circle cx="${sx(r.ev)}" cy="${r.y+11}" r="6" fill="${r.col}" stroke="var(--surface)" stroke-width="2"></circle>
        <text x="${sx(r.ev)}" y="${r.y-14}" font-size="11" font-weight="800" text-anchor="middle" fill="${r.col}">${r.evl}</text></g>` : '';
    return `<g><title>${esc(r.lbl)}</title>
      <text x="${PAD}" y="${r.y-8}" font-size="10" font-weight="800" letter-spacing=".7"
        fill="var(--muted-2)">${esc(r.lbl)}</text>${segs}${ev}</g>`;
  }).join('');

  return `<svg class="fig" viewBox="0 0 ${W} 256" role="img"
      aria-label="Календарь двух городов на одной оси с зоной наложения">
    <title>Два города на одной оси</title>
    ${ticks}${overlap}${bars}
    <line x1="${sx(today)}" y1="30" x2="${sx(today)}" y2="200" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="4 3"></line>
    <text x="${sx(today)+5}" y="27" font-size="9.5" font-weight="800" fill="var(--danger)">сегодня</text>
  </svg>`;
}

function renderScheme(){
  const gap = days(PROJECTS.A.date, PROJECTS.B.date);
  const rows = STAGES.map(st=>{
    const list = stageTasks(st.id), p = prog(list), k = stageWorst(list);
    const win = pk =>{ const l=list.filter(x=>x.p===pk); if(!l.length) return '—';
      const s0=l.reduce((m,x)=>x.start<m?x.start:m,l[0].start), e0=l.reduce((m,x)=>x.end>m?x.end:m,l[0].end);
      return `${fmtS(s0)} — ${fmtS(e0)}`; };
    const roles = ROLES.filter(r=>list.some(x=>x.r===r.id));
    const sBase = list.filter(x=>x.p==='S').length;
    return `<tr>
      <td><div style="display:flex;gap:8px;align-items:center;font-weight:700">

      <div class="scroll-x"><div style="min-width:880px">${figChain()}</div></div>
      <div class="figcap">Порвётся цепочка в любом звене — встанут все следующие. Самое узкое место —
        ДОКУМЕНТЫ: без подписанных договоров нельзя ни печатать макеты с меню, ни выпускать пропуска на заезд.</div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="ask">Почему два города мешают друг другу</div>
      <div class="figcap" style="margin:0 0 16px">Между фестивалями ${gap} дней. БАЗА делается один раз,
        дальше два города идут своими треками — и красная зона показывает недели,
        когда закрытие Москвы совпадает с финальной подготовкой Петербурга.</div>
      <div class="scroll-x"><div style="min-width:680px">${figCities()}</div></div>
      <div class="figcap">В этой полосе одни и те же люди одновременно сдают смету и документы по Москве
        и принимают макеты, застройку и заезд по Петербургу. Разводить пики надо заранее:
        всё, что можно закрыть по Петербургу до 20 июня, должно быть закрыто до 20 июня.</div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="sec-h">Стадии: что должно быть на выходе</div>
      <div class="scroll-x"><table class="ptable">
        <thead><tr><th>Стадия</th><th>Результат на выходе</th><th>Роли</th>
          <th>Москва</th><th>Петербург</th><th>Готово</th></tr></thead>
        <tbody>${rows}</tbody></table></div>

}

/* ---------- 2. ДОРОЖНАЯ КАРТА ---------- */
let roadFilter = 'all';
function renderRoad(){
  const cols = `300px repeat(${MONTHS.length},minmax(64px,1fr))`;
  const nowMo = MONTHS.findIndex(m=>m.getFullYear()===today.getFullYear()&&m.getMonth()===today.getMonth());
  const head = `<div class="ghead" style="grid-template-columns:${cols}">
      <div>Задача · ответственная роль</div>
      ${MONTHS.map((m,i)=>`<div class="mo${i===nowMo?' now':''}">${MONTH_SHORT[m.getMonth()]} ${String(m.getFullYear()).slice(2)}</div>`).join('')}
    </div>`;
  const colGrid = `<div class="gcols" style="grid-template-columns:repeat(${MONTHS.length},1fr)">
      ${MONTHS.map((m,i)=>`<i class="${i===nowMo?'now':''}"></i>`).join('')}</div>`;

  const marks = ['A','B'].map(p=>`<div class="evline" style="left:${pct(PROJECTS[p].date)}%;background:var(--p${p});"
      data-l="${p==='A'?'МСК 20.06':'СПБ 08.08'}"></div>`).join('');

  const list = INST.filter(x=>roadFilter==='all' || x.p===roadFilter || (roadFilter!=='S'&&x.p==='S'));
  const body = PHASES.map(f=>{
    const rows = list.filter(x=>x.ph===f.id)
      .sort((a,b)=>a.start-b.start || a.id.localeCompare(b.id));
    if(!rows.length) return '';
    const p = prog(rows);
    return `<div class="grp"><span>${f.n}</span><span class="pill">${f.s}</span>
        <span class="pc">${p}%</span></div>` +
      rows.map(x=>{
        const k=heatKey(x), s=Store.task(x.id), L=pct(x.start), W=Math.max(0.9, pct(x.end)-L);
        return `<div class="grow" style="grid-template-columns:${cols}">
          <div class="gname">${avatar(x.r,'')}<span>${esc(x.t.length>78?x.t.slice(0,78)+'…':x.t)}
            <span class="rl">${esc(ROLE[x.r].n)} · ${projPill(x.p)}</span></span></div>
          <div class="gtrack">${colGrid}
            <button class="gbar" data-open="${x.id}" title="${esc(x.t)} · ${dl(x)} · ${HEAT[k].l}"
              style="left:${L}%;width:${W}%;background:${HEAT[k].bg};color:${HEAT[k].ink}">
              <i class="fill" style="width:${100-(s.p||0)}%;right:0;left:auto"></i>
              <span>${s.p||0}%</span></button>
          </div></div>`;
      }).join('');
  }).join('');

  $('#v-road').innerHTML = `
    <div class="tools">
      <label>Показать</label>
      ${[['all','Оба города'],['A','Только Москва'],['B','Только Петербург'],['S','Только БАЗА']].map(([v,n])=>
        `<button class="btn ${roadFilter===v?'':'ghost'} sm" data-road="${v}">${n}</button>`).join('')}
      <span style="margin-left:auto;font-size:11.5px;color:var(--muted-2)">Клик по полосе — карточка задачи. Заливка полосы — процент готовности.</span>
    </div>
    <div class="gantt"><div class="gwrap"><div class="ginner" style="position:relative">
      ${head}
      <div style="position:relative">
        <div style="position:absolute;left:300px;right:0;top:0;bottom:0;pointer-events:none;z-index:3">
          ${marks}<div class="today" style="left:${pct(today)}%"></div></div>
        ${body}
      </div>
    </div></div></div>
    <div class="legend">
      <span><i style="background:var(--pA)"></i>Москва · 20 июня 2027 · Коломенское</span>
      <span><i style="background:var(--pB)"></i>Санкт-Петербург · 8 августа 2027 · Елагин парк</span>
      <span><i style="background:var(--danger)"></i>сегодня</span>
      <span>БАЗА — задачи, которые делаются один раз на оба города и входят в готовность обоих.</span>
    </div>`;
}

/* ---------- 3. ТЕПЛОВАЯ КАРТА ---------- */
function renderHeat(){
  const cells = ROLES.map(r=>{
    const tds = MONTHS.map(m=>{
      const m0=new Date(m.getFullYear(),m.getMonth(),1), m1=new Date(m.getFullYear(),m.getMonth()+1,0);
      const list = byRole(r.id).filter(x=>overlaps(x,m0,m1));
      if(!list.length) return `<td><div class="hc" style="background:transparent;border:1px dashed var(--line-soft)"></div></td>`;
      let worst='done', ww=-1;
      list.forEach(x=>{ const k=heatKey(x); if(HEAT[k].w>ww){ ww=HEAT[k].w; worst=k; } });
      const p = prog(list);
      return `<td><div class="hc" style="background:${HEAT[worst].bg};color:${HEAT[worst].ink}"
        title="${esc(r.n)} · ${MONTH_SHORT[m.getMonth()]} ${m.getFullYear()}: ${list.length} задач, готовность ${p}%, худший статус — ${HEAT[worst].l}">${list.length}</div></td>`;
    }).join('');
    return `<tr><th class="rw">${avatar(r.id,'')} ${esc(r.n)}</th>${tds}</tr>`;
  }).join('');

  const worstTasks = INST.filter(x=>(Store.task(x.id).p||0)<100)
    .sort((a,b)=>HEAT[heatKey(b)].w-HEAT[heatKey(a)].w || a.end-b.end).slice(0,12);

  $('#v-heat').innerHTML = `
    <div class="card">
      <div class="sec-h">Загрузка и температура по ролям · число в клетке — сколько задач у роли в этом месяце</div>
      <div class="scroll-x"><table class="heat"><thead><tr><th class="rw"></th>
        ${MONTHS.map(m=>`<th>${MONTH_SHORT[m.getMonth()]}<br>${String(m.getFullYear()).slice(2)}</th>`).join('')}</tr></thead>
        <tbody>${cells}</tbody></table></div>
      <div class="hleg">Цвет клетки — худший статус среди задач роли в месяце:
        ${['done','ok','warn','risk','late'].map(k=>
          `<span class="sw" style="background:${HEAT[k].bg};color:${HEAT[k].ink}">${HEAT[k].l}</span>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="sec-h">Самые горячие задачи</div>
      <div class="tlist">${worstTasks.map(taskRow).join('')||'<div class="empty">Всё закрыто</div>'}</div>
    </div>`;
}
</script>

<script>
/* ---------- 4. БЭКЛОГ НЕДЕЛИ ---------- */
let blRole = null, blWeek = 0;
function weekRange(off){
  const d=new Date(today); const wd=(d.getDay()+6)%7;
  const mon=addD(d,-wd+off*7); return [mon, addD(mon,6)];
}
function renderBacklog(){
  if(!ROLE[blRole]) blRole = Me.id || 'GASTRO';
  const [a,b]=weekRange(blWeek);
  const list = byRole(blRole).filter(x=>overlaps(x,a,b))
    .sort((x,y)=>HEAT[heatKey(y)].w-HEAT[heatKey(x)].w || x.end-y.end);
  const open = list.filter(x=>(Store.task(x.id).p||0)<100);
  const p = prog(list);
  const key = 'plan:'+blRole+':'+iso(a);
  const plan = Store.ai[key];

  $('#v-backlog').innerHTML = `
    <div class="tools">
      <label>Сотрудник</label>
      <select id="blRole">${ROLES.map(r=>`<option value="${r.id}" ${r.id===blRole?'selected':''}>${esc(r.n)}${nameOf(r.id)?' — '+esc(nameOf(r.id)):''}</option>`).join('')}</select>
      <label style="margin-left:10px">Неделя</label>
      <button class="btn ghost sm" data-week="-1">←</button>
      <span class="num" style="font-weight:600">${fmtS(a)} — ${fmtS(b)}</span>
      <button class="btn ghost sm" data-week="1">→</button>
      ${blWeek?`<button class="btn ghost sm" data-week="0">текущая</button>`:''}
      <span style="margin-left:auto"></span>
      <button class="btn lime" id="genPlan">Сформировать план недели</button>
    </div>

    <div class="two">
      <div>
        <div class="card" style="margin-bottom:14px">
          <div class="sec-h row"><span>Задачи в окне недели</span>
            <span class="pill">${open.length} открыто · готовность ${p}%</span></div>
          ${list.length?`<div class="tlist">${list.map(taskRow).join('')}</div>`
            :`<div class="empty">На эту неделю задач по роли нет.${nextBusyWeek()!==null?`<br><button class="btn ghost sm" data-week="jump" style="margin-top:10px">Ближайшая неделя с задачами — ${esc(fmtS(weekRange(nextBusyWeek())[0]))}</button>`:''}</div>`}
        </div>
      </div>
      <div class="grid" style="gap:14px;align-content:start">
        <div class="card">
          <div class="sec-h">${esc(ROLE[blRole].n)}</div>
          <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
            ${avatar(blRole,'av')}
            <div><b style="font-size:13.5px">${esc(nameOf(blRole)||'исполнитель не назначен')}</b>
              <div style="font-size:11.5px;color:var(--muted-2)">${esc(ROLE[blRole].s)}</div></div>
          </div>
          <div class="tstats">
            <div><b>${byRole(blRole).length}</b>всего задач</div>
            <div><b>${byRole(blRole).filter(x=>(Store.task(x.id).p||0)<100).length}</b>открыто</div>
            <div><b>${byRole(blRole).filter(isLate).length}</b>просрочено</div>
          </div>
        </div>
        <div class="card">
          <div class="sec-h">План на неделю</div>
          <div id="planBox">${plan?renderPlan(plan):'<div class="note">Нажмите «Сформировать план недели» — ассистент разложит задачи окна на конкретные шаги с приоритетом и проверяемым результатом.</div>'}</div>
        </div>
      </div>
    </div>`;
  $('#blRole').onchange = e=>{ blRole=e.target.value; renderBacklog(); };
}
function nextBusyWeek(){
  for(let k=0;k<80;k++){
    for(const off of (k?[blWeek+k, blWeek-k]:[blWeek])){
      const [a,b]=weekRange(off);
      if(off!==blWeek && byRole(blRole).some(x=>overlaps(x,a,b))) return off;
    }
  }
  return null;
}
function renderPlan(p){
  if(typeof p === 'string') return `<div style="white-space:pre-wrap;font-size:13px;line-height:1.55">${esc(p)}</div>`;
  return `<div style="font-size:12px;color:var(--muted-2);margin-bottom:8px">Составлен ${esc(p.at||'')}</div>
    <div style="white-space:pre-wrap;font-size:13px;line-height:1.55">${esc(p.text)}</div>`;
}

/* ---------- 5. РИСКИ ---------- */
function renderRisks(){
  const R=computeRisks();
  const ai=Store.ai.risks;
  $('#v-risks').innerHTML = `
    <div class="tools">
      <span class="pill" style="background:var(--h4);color:var(--h4i)">${R.filter(r=>r.lvl==='crit').length} критических</span>
      <span class="pill" style="background:var(--h3);color:var(--h3i)">${R.filter(r=>r.lvl==='high').length} высоких</span>
      <span class="pill" style="background:var(--h2);color:var(--h2i)">${R.filter(r=>r.lvl==='med').length} средних</span>
      <span style="margin-left:auto"></span>
      <button class="btn lime" id="aiRisk">Разбор рисков ассистентом</button>
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(360px,1fr))">
      ${R.map(r=>`<div class="risk ${r.lvl}">
          <div class="rmeta">${lvlPill(r.lvl)}<span class="pill">${esc(r.tag)}</span></div>
          <h4>${esc(r.title)}</h4>
          <p>${esc(r.desc)}</p>
          <div class="fix"><b>Варианты решения</b><ol>${r.fixes.map(f=>`<li>${esc(f)}</li>`).join('')}</ol></div>
        </div>`).join('') || '<div class="empty">Правила рисков ничего не нашли — график чистый</div>'}
    </div>
    <div class="card" style="margin-top:16px">
      <div class="sec-h">Разбор ассистента</div>
      <div id="aiRiskBox">${ai?`<div style="font-size:12px;color:var(--muted-2);margin-bottom:10px">Обновлён ${esc(ai.at||'')} · ${esc(ai.by||'')}</div>
        <div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6">${esc(ai.text)}</div>`
        :'<div class="note">Правила выше видят срок и статус. Ассистент дополнительно смотрит на связку задач между двумя городами и предлагает решения под текущую картину. Разбор сохраняется и виден всей команде.</div>'}</div>
    </div>`;
}

/* ---------- 6. ЧАТЫ ---------- */
let chatRole=null, chatUnsub=null, chatSubRole=null, chatMsgs=[];
function chatLocalKey(r){ return 'chat.'+r; }
function renderChat(){
  if(!ROLE[chatRole]) chatRole = Me.id || 'GASTRO';
  const rows = ROLES.map(r=>{
    const open = byRole(r.id).filter(x=>(Store.task(x.id).p||0)<100 && overlaps(x,today,addD(today,30))).length;
    return `<button class="crow" data-chat="${r.id}" aria-current="${r.id===chatRole}">
      ${avatar(r.id)}<span class="cn"><b>${esc(r.n)}</b><span>${esc(nameOf(r.id)||'исполнитель не назначен')}</span></span>
      ${open?`<span class="pill">${open}</span>`:''}</button>`;
  }).join('');
  const r = ROLE[chatRole];
  const openTasks = byRole(chatRole).filter(x=>(Store.task(x.id).p||0)<100 && overlaps(x,addD(today,-7),addD(today,21)));

  $('#v-chat').innerHTML = `
    <div class="chat">
      <div class="clist">${rows}</div>
      <div class="cpane">
        <div class="chead">${avatar(chatRole,'av')}
          <div><b>${esc(r.n)}</b><div style="font-size:11.5px;color:var(--muted-2)">${esc(nameOf(chatRole)||'исполнитель не назначен')} · ${esc(r.s)}</div></div>
          <span style="margin-left:auto"></span>
          <span class="pill">${nTask(openTasks.length)} в работе</span>
          <button class="btn ghost sm" id="askAI">Спросить ассистента</button>
        </div>
        <div class="cbody" id="cbody"></div>
        <div class="cfoot">
          <textarea id="cinput" placeholder="${Me.id?'Сообщение по задачам роли…':'Сначала выберите себя слева внизу'}" ${Me.id?'':'disabled'}></textarea>
          <button class="btn" id="csend" ${Me.id?'':'disabled'}>Отправить</button>
        </div>
      </div>
    </div>`;
  subscribeChat();
  $('#cinput').addEventListener('keydown', e=>{ if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) sendMsg(); });
  $('#csend').onclick = sendMsg;
  $('#askAI').onclick = askAssistant;
}
function subscribeChat(){
  if(chatUnsub && chatSubRole===chatRole){ paintMsgs(); return; }
  if(chatUnsub){ try{chatUnsub();}catch(e){} chatUnsub=null; }
  chatSubRole=chatRole;
  const ref = Store.chatRef(chatRole);
  if(!ref){ chatMsgs = LS.get(chatLocalKey(chatRole),[]); paintMsgs(); return; }
  chatUnsub = ref.orderBy('ts').limit(200).onSnapshot(snap=>{
    chatMsgs = snap.docs.map(d=>d.data()||{}); paintMsgs();
  }, ()=>{ chatMsgs = LS.get(chatLocalKey(chatRole),[]); paintMsgs(); });
}
function paintMsgs(){
  const box=$('#cbody'); if(!box) return;
  if(!chatMsgs.length){
    box.innerHTML = `<div class="empty">Переписки пока нет. Здесь обсуждают конкретные задачи роли — сроки, блокеры, что передать смежнику.</div>`;
    return;
  }
  box.innerHTML = chatMsgs.map(m=>{
    const mine = m.role===Me.id && m.kind!=='ai';
    const t = m.ts ? new Date(m.ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="msg ${m.kind==='ai'?'ai':(mine?'mine':'')}">
      <div class="mh"><b>${esc(m.kind==='ai'?'Ассистент штаба':(m.who||'—'))}</b><span>${esc(t)}</span></div>${esc(m.text)}</div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}
async function pushMsg(msg){
  const ref = Store.chatRef(chatRole);
  if(ref){ try{ await ref.add(msg); return; }catch(e){} }
  chatMsgs = chatMsgs.concat([msg]).slice(-200);
  LS.set(chatLocalKey(chatRole), chatMsgs); paintMsgs();
}
async function sendMsg(){
  const el=$('#cinput'); const text=(el.value||'').trim(); if(!text||!Me.id) return;
  el.value='';
  await pushMsg({who:Me.label(), role:Me.id, text, ts:Date.now(), kind:'msg'});
}

/* ---------- 7. КОМАНДА ---------- */
function renderTeam(){
  const cards = ROLES.map(r=>{
    const list=byRole(r.id), pr=prog(list), late=list.filter(isLate).length;
    const open=list.filter(x=>(Store.task(x.id).p||0)<100).length;
    const stages = STAGES.filter(st=>list.some(x=>x.st===st.id)).map(st=>st.n);
    return `<div class="tcard">
      <div class="th">${avatar(r.id,'av')}<div><b>${esc(r.n)}</b><span>${esc(r.mix)}</span></div></div>
      <input type="text" data-name="${r.id}" value="${esc(nameOf(r.id))}" placeholder="ФИО исполнителя">
      <div style="font-size:12px;color:var(--muted);line-height:1.45">${esc(r.s)}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap">${stages.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div>
      <div class="bar"><i style="width:${pr}%;background:${late?'var(--h4)':'var(--accent)'}"></i></div>
      <div class="tstats">
        <div><b>${list.length}</b>задач</div><div><b>${open}</b>открыто</div>
        <div><b style="${late?'color:var(--danger)':''}">${late}</b>просрочено</div>
        <div><b>${pr}%</b>готово</div>
      </div>
      <div style="display:flex;gap:7px">
        <button class="btn ghost sm" data-chat-go="${r.id}">Чат</button>
        <button class="btn ghost sm" data-bl-go="${r.id}">Бэклог</button>
      </div>
    </div>`;
  }).join('');
  $('#v-team').innerHTML = `<div class="note" style="margin-bottom:14px">
    Шесть ролей вместо девятнадцати: каждая совмещает несколько функций из оффера.
    Задачи распределены по совмещениям, поэтому одна роль ведёт свой участок целиком —
    от продажи до закрытия. Незаполненные ФИО впишите прямо в карточке.
  </div><div class="team">${cards}</div>`;
}
</script>

<script>
/* =========================================================================
   КАРТОЧКА ЗАДАЧИ
   ========================================================================= */
let drawerId=null;
function openTask(id){

  const deps = x.dep.map(n=>{ const d=depInst(x,n); if(!d) return '';
    const dp=Store.task(d.id).p||0;
    return `<button class="titem" data-open="${d.id}" style="border-left-color:${HEAT[heatKey(d)].bg};width:100%;text-align:left;grid-template-columns:1fr auto">
      <span class="tk" style="font-size:12.5px">${esc(d.t.length>70?d.t.slice(0,70)+'…':d.t)}</span>

  const succ = INST.filter(y=>y.p===x.p && y.dep.includes(x.n) || (x.p==='S' && y.dep.includes(x.n)));

  $('#drawer').innerHTML = `
    <div style="display:flex;gap:10px;align-items:center">
      ${projPill(x.p)}${heatChip(k)}<span class="pill">${esc(PHASES.find(f=>f.id===x.ph).n)}</span>

    </div>
    <h2>${esc(x.t)}</h2>
    <div class="dgrid">
      <div class="dfield"><label>Ответственная роль</label>
        <div class="dval" style="display:flex;gap:8px;align-items:center">${avatar(x.r,'')} ${esc(ROLE[x.r].n)}</div>
        <div style="font-size:11.5px;color:var(--muted-2)">${esc(nameOf(x.r)||'исполнитель не назначен')}</div></div>
      <div class="dfield"><label>Сроки</label>
        <div class="dval num">${fmtL(x.start)}<br>— ${fmtL(x.end)}</div>

function ctxHeader(){

  `Москва (Коломенское) 20 июня 2027 и Санкт-Петербург (Елагин парк) 8 августа 2027, разрыв ${days(PROJECTS.A.date,PROJECTS.B.date)} дней. `+

}
function taskLine(x){
  const s=Store.task(x.id);
  return `- [${PROJECTS[x.p].short}] «${x.t}» — ${ROLE[x.r].n}${nameOf(x.r)?' ('+nameOf(x.r)+')':''}, `+
    `срок ${fmtS(x.start)}–${fmtS(x.end)}, готовность ${s.p||0}%, статус ${HEAT[heatKey(x)].l}`+
    (s.blocked?', БЛОКЕР':'')+(s.note?`, комментарий: ${s.note}`:'');
}

async function aiRisks(){
  const box=$('#aiRiskBox'); if(!box) return;
  if(!SAMPLE){ box.innerHTML=`<div class="note">${noAI}</div>`; return; }
  box.innerHTML = '<div class="thinking">Ассистент разбирает картину проекта…</div>';
  const hot = INST.filter(x=>(Store.task(x.id).p||0)<100 && HEAT[heatKey(x)].w>=2)
    .sort((a,b)=>HEAT[heatKey(b)].w-HEAT[heatKey(a)].w).slice(0,25);
  const soon = INST.filter(x=>overlaps(x,today,addD(today,30)) && (Store.task(x.id).p||0)<100).slice(0,25);
  const rules = computeRisks().map(r=>`- [${r.lvl}] ${r.title}`).join('\n');
  const input = `${ctxHeader()}

Ты — руководитель проектного офиса фестиваля. Разбери риски зоны фуд-корта и дай решения.

Задачи с отставанием и просрочкой:
${hot.map(taskLine).join('\n')||'нет'}

Задачи ближайших 30 дней:
${soon.map(taskLine).join('\n')||'нет'}

Риски, которые уже нашли автоматические правила (не повторяй их дословно, дополняй и связывай):
${rules||'нет'}

Верни 4–6 рисков, которых правила не видят: связки между задачами, конфликты двух городов, внешние подрядчики, юридические и финансовые сроки, репутация перед резидентами.
Формат каждого риска, обычным текстом без markdown-разметки:
РИСК N. Заголовок
Уровень: критический / высокий / средний
Что происходит: 2–3 предложения с опорой на конкретные задачи и даты выше.
Решения: три варианта, каждый с новой строки, начиная с тире. Каждый — конкретное действие с ответственной ролью и сроком.
Пиши по-русски, деловым языком, без воды и без вступления.`;
  try{
    let acc='';
    await SAMPLE(input, {modelTier:'complex', onText:({text})=>{acc=text;
      box.innerHTML = `<div style="white-space:pre-wrap;font-size:13.5px;line-height:1.6">${esc(text)}</div>`;}});
    await Store.saveAI('risks', {text:acc, at:new Date().toLocaleString('ru-RU'), by:Me.label()});
  }catch(e){
    box.innerHTML = `<div class="note">${e.code==='not_granted'?'Разбор не выполнен: доступ к ассистенту не выдан.':'Не удалось получить разбор ('+esc(e.code||'ошибка')+'). Правила рисков выше работают всегда.'}</div>`;
  }
}

async function aiPlan(){
  const box=$('#planBox'); if(!box) return;
  if(!SAMPLE){ box.innerHTML=`<div class="note">${noAI}</div>`; return; }
  const [a,b]=weekRange(blWeek);
  const list = byRole(blRole).filter(x=>overlaps(x,a,b) && (Store.task(x.id).p||0)<100);
  if(!list.length){ box.innerHTML='<div class="note">На эту неделю открытых задач нет — план не нужен.</div>'; return; }
  box.innerHTML = '<div class="thinking">Ассистент собирает план недели…</div>';
  const blockers = list.flatMap(x=>x.dep.map(n=>depInst(x,n)).filter(d=>d&&(Store.task(d.id).p||0)<100)
    .map(d=>`- «${x.t.slice(0,50)}…» ждёт «${d.t.slice(0,50)}…» (${ROLE[d.r].n}, ${Store.task(d.id).p||0}%)`));
  const input = `${ctxHeader()}

Собери рабочий план на неделю ${fmtL(a)} — ${fmtL(b)} для роли «${ROLE[blRole].n}»${nameOf(blRole)?' ('+nameOf(blRole)+')':''}.
Зона ответственности роли: ${ROLE[blRole].s}.

Открытые задачи в окне недели:
${list.map(taskLine).join('\n')}

Незакрытые входы от смежников:
${blockers.join('\n')||'нет'}

Верни план обычным текстом без markdown-разметки:
ФОКУС НЕДЕЛИ: одна фраза — главное, что должно закрыться.
Затем по каждой задаче блок:
Задача (сокращённо)
- 2–4 шага на неделю, каждый с новой строки через тире, каждый — действие за один-два дня с проверяемым результатом
- Срок внутри недели и от кого нужен вход, если он есть
В конце: ЧТО ЗАПРОСИТЬ У СМЕЖНИКОВ — список из 1–3 пунктов с ролью и датой.
Пиши по-русски, коротко, без вступления.`;
  try{
    let acc='';
    await SAMPLE(input, {onText:({text})=>{acc=text;
      box.innerHTML=`<div style="white-space:pre-wrap;font-size:13px;line-height:1.55">${esc(text)}</div>`;}});
    await Store.saveAI('plan:'+blRole+':'+iso(a), {text:acc, at:new Date().toLocaleString('ru-RU')});
  }catch(e){
    box.innerHTML = `<div class="note">${e.code==='not_granted'?'Доступ к ассистенту не выдан.':'Не удалось собрать план ('+esc(e.code||'ошибка')+').'}</div>`;
  }
}

async function askAssistant(){
  if(!SAMPLE){ await pushMsg({who:'Ассистент штаба', role:chatRole, kind:'ai', ts:Date.now(), text:noAI}); return; }
  const q = ($('#cinput').value||'').trim();
  $('#cinput').value='';
  const r=ROLE[chatRole];
  const list = byRole(chatRole).filter(x=>(Store.task(x.id).p||0)<100).slice(0,20);
  const hist = chatMsgs.slice(-10).map(m=>`${m.who||'—'}: ${m.text}`).join('\n');
  const box=$('#cbody');
  if(box) box.insertAdjacentHTML('beforeend','<div class="msg ai" id="aiTmp"><div class="thinking">Ассистент думает…</div></div>');
  if(box) box.scrollTop=box.scrollHeight;
  const input = `${ctxHeader()}

Ты — ассистент проектного штаба фуд-корта. Отвечаешь в рабочем чате роли «${r.n}»${nameOf(chatRole)?' ('+nameOf(chatRole)+')':''}.
Зона ответственности: ${r.s}.

Открытые задачи этой роли:
${list.map(taskLine).join('\n')||'нет'}

Последние сообщения чата:
${hist||'чат пуст'}

Вопрос: ${q||'Что мне сейчас важнее всего сделать по моим задачам и что может сорваться?'}

Ответь по-русски, 3–6 предложений или коротким списком через тире, без markdown-разметки. Опирайся на конкретные задачи и даты выше. Если нужно решение — предложи один вариант и назови следующий шаг.`;
  try{
    if(q) await pushMsg({who:Me.label()||'Вопрос', role:Me.id||chatRole, text:q, ts:Date.now(), kind:'msg'});
    const {text} = await SAMPLE(input);
    const tmp=document.getElementById('aiTmp'); if(tmp) tmp.remove();
    await pushMsg({who:'Ассистент штаба', role:chatRole, kind:'ai', ts:Date.now(), text});
  }catch(e){
    const tmp=document.getElementById('aiTmp'); if(tmp) tmp.remove();
    await pushMsg({who:'Ассистент штаба', role:chatRole, kind:'ai', ts:Date.now(),
      text: e.code==='not_granted'?'Доступ к ассистенту не выдан — отвечать не могу.':'Не получилось ответить ('+(e.code||'ошибка')+').'});
  }
}

function bindOrg(){
  const wrap=$('#orgWrap'), card=$('#orgCard'); if(!wrap||!card) return;
  const show = (el,id)=>{
    card.innerHTML = orgCard(ORGBY[id]); card.hidden=false;
    const wr=wrap.getBoundingClientRect(), nr=el.getBoundingClientRect();
    const cw=Math.min(400, wr.width-24);
    card.style.width = cw+'px';
    const ch = card.offsetHeight;
    const nL = nr.left - wr.left, nT = nr.top - wr.top;
    let left, top;
    if(nT + nr.height + 10 + ch <= wr.height){            // под позицией
      top = nT + nr.height + 10;
      left = nL + nr.width/2 - cw/2;
    } else if(nT - 10 - ch >= 0){                          // над позицией
      top = nT - 10 - ch;
      left = nL + nr.width/2 - cw/2;
    } else {                                               // сбоку, чтобы не накрыть саму позицию
      top = Math.max(4, Math.min(wr.height - ch - 4, nT + nr.height/2 - ch/2));
      left = (nL + nr.width + 12 + cw <= wr.width) ? nL + nr.width + 12 : nL - cw - 12;
    }
    card.style.left = Math.max(4, Math.min(wr.width - cw - 4, left))+'px';
    card.style.top  = Math.max(4, top)+'px';
  };
  const hide = ()=>{ if(!orgPinned){ card.hidden=true; } };
  wrap.querySelectorAll('.onode').forEach(el=>{
    const id = el.dataset.org;
    el.addEventListener('mouseenter', ()=>{ if(!orgPinned) show(el,id); });
    el.addEventListener('focus',      ()=>{ show(el,id); });
    el.addEventListener('mouseleave', hide);
    el.addEventListener('blur',       hide);
    el.addEventListener('click', e=>{ e.stopPropagation();
      if(orgPinned===id){ orgPinned=null; card.hidden=true; }
      else { orgPinned=id; show(el,id); } });
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); el.click(); } });
  });
  wrap.addEventListener('click', ()=>{ orgPinned=null; card.hidden=true; });
}

/* =========================================================================
   НАГРУЗКА И НАЙМ
   ========================================================================= */
const WEEKS = (()=>{ const a=[]; let d=new Date(T0); d=addD(d,-((d.getDay()+6)%7));
  while(d<TEND){ a.push(new Date(d)); d=addD(d,7); } return a; })();
const FTE_H = 40;

function loadByWeek(list){
  return WEEKS.map(w0=>{ const w1=addD(w0,6); let h=0;
    list.forEach(x=>{
      const s = x.start>w0?x.start:w0, e = x.end<w1?x.end:w1;
      if(s>e) return;
      const tot = days(x.start,x.end)+1, ov = days(s,e)+1;
      h += (x.h||0)*ov/tot;
    });
    return h; });
}
const LOAD = {}; ROLES.forEach(r=>{ LOAD[r.id] = loadByWeek(byRole(r.id)); });
const LOAD_ALL = WEEKS.map((_,i)=>ROLES.reduce((s,r)=>s+LOAD[r.id][i],0));
const LOAD_MAX = Math.max(20, Math.ceil(Math.max(...ROLES.map(r=>Math.max(...LOAD[r.id])))/20)*20);

function peakFTE(roleId){
  const a = LOAD[roleId]; let mi=0;
  a.forEach((v,i)=>{ if(v>a[mi]) mi=i; });
  return {fte:a[mi]/FTE_H, week:WEEKS[mi], hours:a[mi]};
}
function roleStats(r){
  const a = LOAD[r.id], act = a.filter(v=>v>0.5);
  const hours = byRole(r.id).reduce((s,x)=>s+(x.h||0),0);
  const avg = act.length ? act.reduce((s,v)=>s+v,0)/act.length/FTE_H : 0;
  const pk = peakFTE(r.id);
  const over = a.filter(v=>v>FTE_H).length;
  let verdict, tone;
  if(!nameOf(r.id))            { verdict='Вакансия открыта'; tone='crit'; }
  else if(pk.fte>1.5)          { verdict='Нужен второй человек на пик'; tone='high'; }
  else if(avg>0.8)             { verdict='Полная ставка'; tone='ok'; }
  else if(avg>0.4)             { verdict='Неполная ставка'; tone='ok'; }
  else                         { verdict='Ниже половины ставки — есть запас'; tone='ok'; }
  return {hours, avg, peak:pk, over, weeks:act.length, verdict, tone};
}

/* ---------- малые кратные: недельная нагрузка каждой роли ---------- */
function figLoad(roleId){
  const W=320, H=78, PL=4, PR=4, PT=8, PB=14;
  const a = LOAD[roleId], n = a.length;
  const step = (W-PL-PR)/(n-1);
  const y = v => PT + (H-PT-PB) * (1 - Math.min(v,LOAD_MAX)/LOAD_MAX);
  const px = i => PL + i*step;
  const pts = a.map((v,i)=>`${px(i).toFixed(1)},${y(v).toFixed(1)}`).join(' L');
  const area = `M${px(0)},${y(0)} L${pts} L${px(n-1)},${y(0)} Z`;
  const yF = y(FTE_H);
  const evx = ['A','B'].map(p=>{ const i=WEEKS.findIndex(w=>days(w,PROJECTS[p].date)>=0 && days(w,PROJECTS[p].date)<7);
    return i<0?'':`<line x1="${px(i)}" y1="${PT}" x2="${px(i)}" y2="${H-PB}" stroke="var(--p${p})" stroke-width="1.2" opacity=".55"></line>`; }).join('');
  const ticks = WEEKS.map((w,i)=>({w,i})).filter(({w})=>w.getDate()<=7 && w.getMonth()%3===0)
    .map(({w,i})=>`<text x="${px(i)}" y="${H-3}" font-size="7.6" text-anchor="middle" fill="var(--muted-2)">${MONTH_SHORT[w.getMonth()]} ${String(w.getFullYear()).slice(2)}</text>`).join('');
  return `<svg class="fig loadfig" data-load="${roleId}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
      role="img" aria-label="Недельная нагрузка роли в часах">
    <title>Часы в неделю; пунктир — одна ставка, 40 часов</title>
    <path d="${area}" fill="var(--rc-${roleId})" opacity=".18"></path>
    <path d="M${pts}" fill="none" stroke="var(--rc-${roleId})" stroke-width="2"
      stroke-linejoin="round" stroke-linecap="round"></path>
    ${evx}
    <line x1="${PL}" y1="${yF}" x2="${W-PR}" y2="${yF}" stroke="var(--danger)" stroke-width="1"
      stroke-dasharray="3 3" opacity=".75"></line>
    <line x1="${PL}" y1="${H-PB}" x2="${W-PR}" y2="${H-PB}" stroke="var(--line)" stroke-width="1"></line>
    ${ticks}
    <line class="lcross" x1="0" y1="${PT}" x2="0" y2="${H-PB}" stroke="currentColor" stroke-width="1" opacity="0"></line>
    <rect class="lhit" x="0" y="0" width="${W}" height="${H}" fill="transparent"></rect>
  </svg>`;
}
