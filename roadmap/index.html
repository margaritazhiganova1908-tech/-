function bindLoadTips(){
  const tip=$('#ltip'), grid=$('#lgrid'); if(!tip||!grid) return;
  grid.querySelectorAll('.loadfig').forEach(svg=>{
    const roleId = svg.dataset.load, a = LOAD[roleId];
    const cross = svg.querySelector('.lcross');
    const move = e=>{
      const b = svg.getBoundingClientRect();
      const t = Math.max(0, Math.min(1, (e.clientX-b.left)/b.width));
      const i = Math.round(t*(a.length-1));
      const vx = 4 + i*((320-8)/(a.length-1));
      cross.setAttribute('x1',vx); cross.setAttribute('x2',vx); cross.setAttribute('opacity','.5');
      const g = grid.getBoundingClientRect();
      tip.innerHTML = `<b>${esc(ROLE[roleId].n)}</b><br>неделя ${fmtS(WEEKS[i])} — ${fmtS(addD(WEEKS[i],6))}<br>
        <span class="num">${a[i].toFixed(1)} ч · ${(a[i]/FTE_H).toFixed(2)} ставки</span>`;
      tip.hidden=false;
      const tw = tip.offsetWidth||180;
      tip.style.left = Math.max(4, Math.min(g.width-tw-4, e.clientX-g.left+12))+'px';
      tip.style.top  = Math.max(4, e.clientY-g.top-10)+'px';
    };
    svg.addEventListener('mousemove', move);
    svg.addEventListener('mouseleave', ()=>{ cross.setAttribute('opacity','0'); tip.hidden=true; });
  });
}

  const H = f.steps.length*(rowH+gap)+8;
  const rows = f.steps.map((st,i)=>{
    const w = Math.max(70, (W-PL*2) * (0.32 + 0.68*st.v/maxV));
    const y = 4 + i*(rowH+gap);
    const x = PL + ((W-PL*2)-w)/2;
    const val = st.v>=1000 ? (st.v/1000).toFixed(st.v>=10000?0:1).replace('.',',')+' тыс.' : String(st.v);
    const wide = w >= 250;
    const subMax = Math.floor((w-26-(wide?62:0))/4.75);
    const sub = (wide && subMax>=12)
      ? `<text x="${x+13}" y="${y+31}" font-size="9.3" fill="#fff" opacity=".85">${esc(st.s.length>subMax?st.s.slice(0,subMax)+'…':st.s)}</text>` : '';
    const valT = wide
      ? `<text x="${x+w-13}" y="${y+25}" font-size="13" font-weight="800" text-anchor="end" fill="#fff">${val}</text>`
      : `<text x="${x+13}" y="${y+33}" font-size="12.5" font-weight="800" fill="#fff">${val}</text>`;
    return `<g><title>${esc(st.l)}: ${esc(String(st.v))} — ${esc(st.s)}</title>
      <rect x="${x}" y="${y}" width="${w}" height="${rowH}" rx="8" fill="${f.color}"
        opacity="${(0.92 - i*0.11).toFixed(2)}"></rect>
      <text x="${x+13}" y="${y+(wide?18:17)}" font-size="11.5" font-weight="800" fill="#fff">${esc(st.l)}</text>
      ${sub}${valT}
    </g>`;
  }).join('');
  return `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(f.n)}">
    <title>${esc(f.n)}</title>${rows}</svg>`;
}

/* =========================================================================
   МАРШРУТИЗАЦИЯ, СОБЫТИЯ, СТАРТ
   ========================================================================= */
const RENDER = {dash:renderDash, scheme:renderScheme, road:renderRoad, heat:renderHeat,
                backlog:renderBacklog, risks:renderRisks, chat:renderChat, team:renderTeam,
                org:renderOrg, hr:renderHR, mkt:renderMarketing};
function go(v){
  VIEW=v;
  document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-current', String(b.dataset.v===v)));
  Object.keys(RENDER).forEach(k=>{ $('#v-'+k).hidden = (k!==v); });
  $('#vTitle').textContent = TITLES[v][0];
  $('#vSub').textContent   = TITLES[v][1];
  if(v!=='chat' && chatUnsub){ try{chatUnsub();}catch(e){} chatUnsub=null; chatSubRole=null; }
  render();
  window.scrollTo({top:0});
}
function render(){
  paintTop();
  const f = RENDER[VIEW]; if(f) f();
  if(drawerId && document.activeElement !== document.getElementById('dNote')) openTask(drawerId);
}
function paintTop(){
  const late=INST.filter(isLate).length, risks=computeRisks();
  $('#s-all').textContent  = prog(INST)+'%';
  $('#s-a').textContent    = projProgress('A')+'%';
  $('#s-b').textContent    = projProgress('B')+'%';
  $('#s-late').textContent = late;
  $('#s-late').style.color = late?'var(--danger)':'';
  const nb=$('#n-backlog'), nr=$('#n-risks');
  const mine = Me.id ? byRole(Me.id).filter(x=>overlaps(x,...weekRange(0)) && (Store.task(x.id).p||0)<100).length : 0;
  nb.textContent = mine; nb.hidden = !Me.id || !mine;
  nr.textContent = risks.length;
  nr.className = 'cnt' + (risks.some(r=>r.lvl==='crit') ? ' hot' : '');
  nr.hidden = !risks.length;
}
function paintMe(){
  const r=Me.role();
  $('#meAv').textContent = r?r.ab:'?';
  $('#meAv').style.background = r?`var(--rc-${r.id})`:'var(--mute-bg)';
  $('#meAv').style.color = r?`var(--ri-${r.id})`:'var(--mute-ink)';
  $('#meName').textContent = r ? (nameOf(r.id)||r.n) : 'Выберите себя';
  $('#meRole').textContent = r ? r.n : 'роль не выбрана';
}

document.addEventListener('click', e=>{
  const t=e.target.closest('[data-v],[data-go],[data-open],[data-set],[data-done],[data-road],[data-week],[data-chat],[data-chat-go],[data-bl-go],[data-me]');
  if(!t) return;
  const d=t.dataset;
  if(d.v)   return go(d.v);
  if(d.go)  return go(d.go);
  if(d.open){ e.preventDefault(); return openTask(d.open); }
  if(d.set !== undefined && d.p !== undefined) return void Store.saveTask(d.set, {p:Number(d.p)});
  if(d.done !== undefined){
    const cur = Store.task(d.done).p||0;
    return void Store.saveTask(d.done, {p: cur>=100?75:100});
  }
  if(d.road){ roadFilter=d.road; return renderRoad(); }
  if(d.week !== undefined){
    if(d.week==='jump'){ const j=nextBusyWeek(); if(j!==null) blWeek=j; }
    else blWeek = d.week==='0' ? 0 : blWeek + Number(d.week);
    return renderBacklog();
  }
  if(d.chat){ if(chatRole!==d.chat){ chatSubRole=null; } chatRole=d.chat; return renderChat(); }
  if(d.chatGo){ chatSubRole=null; chatRole=d.chatGo; return go('chat'); }
  if(d.blGo){ blRole=d.blGo; blWeek=0; return go('backlog'); }
  if(d.me){ Me.set(d.me); $('#modal').hidden=true; return; }
});
document.addEventListener('change', e=>{
  if(e.target.matches('[data-name]')) Store.saveRoster(e.target.dataset.name, {name:e.target.value.trim()});
});
document.addEventListener('click', e=>{
  if(e.target.id==='genPlan') aiPlan();
  if(e.target.id==='aiRisk')  aiRisks();
});
$('#scrim').onclick = closeDrawer;
$('#meBtn').onclick = openWho;
document.addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(!$('#drawer').hidden) closeDrawer();
  else if(!$('#modal').hidden) $('#modal').hidden=true;
});

/* тема */
(function(){
  const saved = LS.get('theme', null);
  if(saved) document.documentElement.setAttribute('data-theme', saved);
  $('#themeBtn').onclick = ()=>{
    const cur = document.documentElement.getAttribute('data-theme');
    const sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const next = cur ? (cur==='dark'?'light':'dark') : (sysDark?'light':'dark');
    document.documentElement.setAttribute('data-theme', next);
    LS.set('theme', next);
    if(VIEW==='road') renderRoad();
  };
})();

/* старт */
setSync(false);
paintMe();
go('dash');
Store.onChange(()=>{ paintMe(); render(); });
Store.init();
initAI();
if(!Me.id) setTimeout(openWho, 400);
</script>
