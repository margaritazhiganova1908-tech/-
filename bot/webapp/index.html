<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>HUMAN</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Golos+Text:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#0a0a0b; --ink:#f2f4f6; --muted:#8b9099; --line:#2a2c31; --card:#131417;
    --accent:#cfe0ea; --accent-ink:#0a0a0b; --accent-dim:#7d94a3;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
    --sans:"Golos Text",-apple-system,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
    -webkit-tap-highlight-color:transparent}
  .app{display:flex;flex-direction:column;height:100dvh;max-width:560px;margin:0 auto}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- заставка ---------- */
  .splash{position:fixed;inset:0;z-index:20;background:var(--paper);display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center}
  .splash h1{font-size:34px;font-weight:500;letter-spacing:.62em;margin:0 0 0 .62em;color:var(--ink)}
  .splash .rule{width:min(78vw,340px);height:1px;margin:20px 0 18px;
    background:repeating-linear-gradient(90deg,var(--accent-dim) 0 6px,transparent 6px 12px)}
  .splash p{font-family:var(--sans);font-size:14px;color:var(--muted);margin:0;max-width:24ch;line-height:1.5}
  .splash .line{font-size:10px;letter-spacing:.28em;color:var(--accent-dim);margin-top:26px}
  .splash .skip{position:absolute;bottom:30px;background:none;border:0;color:var(--muted);
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:10px}
  @media (prefers-reduced-motion:no-preference){
    .splash h1{animation:track 1.5s cubic-bezier(.2,.7,.2,1) both}
    .splash .rule{animation:print .7s .8s both}
    .splash p{animation:up .6s 1.15s both}
    .splash .line{animation:up .6s 1.45s both}
    .splash.out{animation:fade .45s both}
  }
  @keyframes track{from{letter-spacing:.02em;opacity:0}to{letter-spacing:.62em;opacity:1}}
  @keyframes print{from{width:0}to{width:min(78vw,340px)}}
  @keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes fade{to{opacity:0;visibility:hidden}}

  /* ---------- шапка ---------- */
  .top{flex:0 0 auto;padding:12px 18px 0}
  .toprow{display:flex;justify-content:space-between;align-items:center;font-size:10px;
    letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .toprow button{background:none;border:0;padding:4px 0;letter-spacing:.2em;color:var(--muted)}
  .bars{display:flex;gap:5px;margin-top:10px}
  .bar{height:2px;flex:1;background:var(--line)}
  .bar.done{background:var(--accent-dim)}
  .bar.now{background:var(--accent)}
  .bars[hidden]{display:none}

  .scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:14px 18px 18px;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .view{animation:in .2s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view{animation:none}}

  /* ---------- чек ---------- */
  .brandbar{display:flex;justify-content:space-between;background:var(--accent);color:var(--accent-ink);
    padding:7px 10px;font-size:10px;letter-spacing:.22em;font-weight:600}
  .r-title{text-align:center;font-size:15px;letter-spacing:.34em;margin:18px 0 5px}
  .r-sub{text-align:center;font-size:9px;letter-spacing:.18em;color:var(--muted);margin:0 0 14px;line-height:1.7}
  .cut{border-top:1px dashed #4a4f5a;margin:12px 0}
  .kv{display:flex;justify-content:space-between;gap:12px;font-size:10.5px;letter-spacing:.06em;
    color:var(--muted);padding:3px 0}
  .kv b{color:var(--ink);font-weight:500;text-align:right}
  .about{font-family:var(--sans);font-size:14.5px;line-height:1.55;color:#c8ccd4;margin:12px 0}
  .th{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.18em;color:var(--muted);
    padding-bottom:6px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;
    background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0;text-align:left}
  .row .n{font-size:12.5px;letter-spacing:.1em;color:var(--ink)}
  .row .t{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);
    letter-spacing:0;margin-top:3px}
  .row .p{font-size:12px;color:var(--accent);white-space:nowrap}
  .row:active{background:#111318}
  .total{display:flex;justify-content:space-between;align-items:center;margin:12px 0 0}
  .total span:first-child{font-size:11px;letter-spacing:.2em}
  .total span:last-child{font-size:15px;background:var(--accent);color:var(--accent-ink);padding:2px 8px}
  .thanks{text-align:center;font-size:9px;letter-spacing:.24em;color:var(--muted);margin:16px 0 10px}
  .bars-code{display:flex;gap:2px;justify-content:center;height:28px;margin-bottom:6px}
  .bars-code i{display:block;background:#e7eaef}

  /* ---------- страница услуги ---------- */
  .s-tag{font-size:9px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase}
  .s-title{font-size:22px;letter-spacing:.1em;margin:8px 0 12px}
  .s-price{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
  .s-price b{font-size:24px;background:var(--accent);color:var(--accent-ink);padding:1px 8px;font-weight:500}
  .s-price span{font-size:10px;letter-spacing:.16em;color:var(--muted)}
  .s-desc{font-family:var(--sans);font-size:15px;line-height:1.6;color:#ccd1d9;margin:0 0 16px}
  .inc{list-style:none;margin:0;padding:0}
  .inc li{font-family:var(--sans);font-size:14px;line-height:1.5;color:#c2c7d0;padding:8px 0 8px 18px;
    border-bottom:1px solid var(--line);position:relative}
  .inc li::before{content:"→";position:absolute;left:0;top:8px;color:var(--accent-dim);font-family:var(--mono);font-size:12px}

  /* ---------- календарь ---------- */
  .cal-label{font-size:9px;letter-spacing:.2em;color:var(--muted);margin:20px 0 8px}
  .days{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day{flex:0 0 auto;width:56px;border:1px solid var(--line);background:var(--card);padding:8px 0;
    text-align:center;color:var(--muted)}
  .day i{display:block;font-style:normal;font-size:9px;letter-spacing:.14em}
  .day b{display:block;font-size:17px;font-weight:500;color:var(--ink);margin:3px 0 1px}
  .day u{display:block;text-decoration:none;font-size:8.5px;letter-spacing:.1em}
  .day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .day[aria-pressed="true"] b{color:var(--accent-ink)}
  .times{display:flex;flex-wrap:wrap;gap:6px}
  .time{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;font-size:13px}
  .time[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .cal-note{font-family:var(--sans);font-size:12.5px;line-height:1.5;color:var(--muted);margin:14px 0 0}

  /* ---------- разделы и опрос ---------- */
  .item{display:flex;gap:12px;align-items:baseline;width:100%;background:none;border:0;
    border-bottom:1px solid var(--line);padding:14px 0;text-align:left}
  .item .idx{font-size:10px;color:var(--muted);min-width:20px}
  .item .t{font-size:14px;letter-spacing:.06em;display:block}
  .item .s{font-family:var(--sans);font-size:12.5px;color:var(--muted);display:block;margin-top:3px;line-height:1.4}
  .item .go{margin-left:auto;color:var(--muted)}
  h1.slide{font-size:26px;line-height:1.25;letter-spacing:.02em;font-weight:500;margin:0 0 14px}
  h1.slide mark{background:var(--accent);color:var(--accent-ink);padding:0 4px}
  .kicker{font-size:9.5px;letter-spacing:.2em;color:var(--muted);margin:0 0 12px;text-transform:uppercase}
  .lead{font-family:var(--sans);font-size:15px;line-height:1.6;color:#c8ccd4;margin:0 0 16px}
  .meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--accent-dim);
    border-bottom:1px solid var(--accent-dim);margin:0 0 18px}
  .meta div{padding:9px 8px}
  .meta div+div{border-left:1px solid var(--line)}
  .meta .l{font-size:8.5px;letter-spacing:.16em;color:var(--muted);margin-bottom:5px}
  .meta .v{font-size:13px}
  .section{font-size:9px;letter-spacing:.2em;color:var(--muted);border-bottom:1px solid var(--line);
    padding-bottom:7px;margin:0 0 2px}
  ol{list-style:none;margin:0;padding:0}
  .n{flex:0 0 auto;min-width:24px;font-size:10px;color:var(--accent);padding-top:3px}
  .rows li,.cards li,.steps li{display:flex;gap:10px;align-items:flex-start;padding:12px 0;
    border-bottom:1px solid var(--line)}
  .rows .t,.cards .t,.steps .t{font-family:var(--sans);font-size:14.5px;font-weight:500;line-height:1.35}
  .rows .q,.cards .q,.steps .q{font-family:var(--sans);font-size:13px;line-height:1.45;color:var(--muted);margin-top:3px}
  .note{font-family:var(--sans);font-size:13px;line-height:1.5;color:var(--muted);
    border-left:2px solid var(--accent-dim);padding-left:11px;margin:16px 0 0}
  .opts{display:grid;gap:7px}
  .opt{text-align:left;width:100%;background:var(--card);border:1px solid var(--line);padding:14px;
    font-family:var(--sans);font-size:14.5px;line-height:1.35}
  .opt:active{background:var(--accent);color:var(--accent-ink)}
  .qz h2{font-family:var(--sans);font-size:19px;line-height:1.35;font-weight:600;margin:0 0 18px}
  .res-hours{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--accent-dim);
    padding-bottom:12px;margin-bottom:8px}
  .res-hours b{font-size:48px;line-height:1;background:var(--accent);color:var(--accent-ink);padding:0 8px;font-weight:500}
  .res-hours span{font-size:12px;color:var(--muted)}
  .res-note{font-family:var(--sans);font-size:12.5px;color:var(--muted);line-height:1.45;margin:0 0 22px}
  .res-name{font-size:19px;letter-spacing:.06em;margin:8px 0 10px}
  .gift{width:100%;background:var(--accent);color:var(--accent-ink);border:0;padding:15px;
    font-size:12px;letter-spacing:.16em;margin-top:10px}

  /* ---------- низ ---------- */
  .bottom{flex:0 0 auto;padding:8px 18px calc(10px + env(safe-area-inset-bottom));background:var(--paper);
    border-top:1px solid var(--line)}
  .navrow{display:flex;gap:6px}
  .navrow[hidden]{display:none}
  .back{flex:0 0 auto;width:48px;border:1px solid var(--line);background:none;font-size:16px}
  .next{flex:1 1 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--accent);color:var(--accent-ink);border:0;padding:15px 16px;text-align:left}
  .next[disabled]{background:var(--card);color:var(--muted);border:1px solid var(--line)}
  .next .lbl{font-size:12px;letter-spacing:.18em;font-weight:600}
  .next .hint{font-size:9px;letter-spacing:.1em;opacity:.7}
  .chan{flex:0 0 auto;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink);
    padding:0 14px;font-size:10px;letter-spacing:.18em;text-decoration:none}
  .chan[hidden]{display:none}
  .foot{text-align:center;font-size:9.5px;letter-spacing:.16em;color:#585d66;padding-top:9px}
</style>
</head>
<body>
<div class="splash" id="splash">
  <h1 id="spTitle">HUMAN</h1>
  <div class="rule"></div>
  <p id="spSub"></p>
  <div class="line" id="spLine"></div>
  <button class="skip" id="spSkip">пропустить</button>
</div>

<div class="app">
  <header class="top">
    <div class="toprow">
      <button id="close">× <span id="closeLabel">закрыть</span></button>
      <div id="where"></div>
    </div>
    <div class="bars" id="bars" hidden></div>
  </header>
  <main class="scroll" id="scroll"><section class="view" id="view"></section></main>
  <footer class="bottom">
    <div class="navrow" id="navrow">
      <button class="back" id="back" aria-label="назад">‹</button>
      <button class="next" id="next"><span class="lbl" id="nextLabel"></span><span class="hint" id="nextHint"></span></button>
      <a class="chan" id="chan" target="_blank" rel="noopener" hidden>КАНАЛ</a>
    </div>
    <div class="foot" id="foot"></div>
  </footer>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#0a0a0b'); tg.setBackgroundColor('#0a0a0b'); } catch (e) {} }
  var $ = function (id) { return document.getElementById(id); };

  var deck = null, view = 'home', si = 0, i = 0, sv = null, seen = {};
  var qz = { step: -1, answers: [] };
  var pick = { date: null, time: null };

  function haptic(k) { try { tg.HapticFeedback.impactOccurred(k || 'light'); } catch (e) {} }
  function send(p) { try { tg.sendData(JSON.stringify(p)); return true; } catch (e) { return false; } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
    });
  }
  function rich(s) { return esc(s).replace(/==(.+?)==/g, '<mark>$1</mark>').replace(/\n/g, '<br>'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function sec() { return deck.sections[si]; }
  function nav(show) { $('navrow').hidden = !show; }
  function barcode() {
    var w = [2, 5, 2, 3, 6, 2, 4, 2, 7, 3, 2, 5, 2, 4, 6, 2, 3, 5, 2, 4, 2, 6, 3, 2];
    return '<div class="bars-code">' + w.map(function (x) {
      return '<i style="width:' + x + 'px"></i>';
    }).join('') + '</div>';
  }

  /* ================= ВИТРИНА (ЧЕК) ================= */
  function renderHome() {
    var h = deck.home, out = '';
    out += '<div class="brandbar"><span>' + esc(h.brand) + '</span><span>' + esc(h.date) + '</span></div>';
    out += '<p class="r-title">' + esc(h.title) + '</p>';
    out += '<p class="r-sub">' + esc(h.sub) + '</p>';
    out += '<div class="cut"></div>';
    out += h.meta.map(function (m) {
      return '<div class="kv"><span>' + esc(m[0]) + '</span><b>' + esc(m[1]) + '</b></div>';
    }).join('');
    out += '<div class="cut"></div>';
    out += '<p class="about">' + esc(h.about) + '</p>';
    out += '<div class="th"><span>' + esc(h.listLabel) + '</span><span>' + esc(h.priceLabel) + '</span></div>';
    out += deck.services.map(function (s, k) {
      return '<button class="row" type="button" data-svc="' + k + '">' +
        '<span><span class="n">' + esc(s.title) + '</span><span class="t">' + esc(s.tag) + '</span></span>' +
        '<span class="p">' + esc(s.price) + '</span></button>';
    }).join('');
    var quiz = deck.sections.filter(function (x) { return x.type === 'quiz'; })[0];
    if (quiz) {
      out += '<button class="row" type="button" data-quiz="1">' +
        '<span><span class="n">РЕВИЗИЯ РОЛИ</span><span class="t">' + esc(quiz.summary) + '</span></span>' +
        '<span class="p">' + esc(h.free) + '</span></button>';
    }
    out += '<div class="cut"></div>';
    out += '<div class="total"><span>' + esc(h.totalLabel) + '</span><span>' + esc(h.totalValue) + '</span></div>';
    out += '<div class="cut"></div>';
    out += '<button class="row" type="button" data-more="1">' +
      '<span><span class="n">' + esc(h.more) + '</span><span class="t">' + esc(h.moreHint) + '</span></span>' +
      '<span class="p">→</span></button>';
    out += '<p class="thanks">' + esc(h.thanks) + '</p>' + barcode();

    $('view').innerHTML = out;
    $('scroll').scrollTop = 0;
    $('bars').hidden = true;
    $('where').textContent = '';
    $('closeLabel').textContent = 'закрыть';
    $('back').hidden = true;
    nav(true);
    $('nextLabel').textContent = h.book;
    $('nextHint').textContent = '';
    $('next').disabled = false;
    $('chan').hidden = false;
    if (tg && tg.BackButton) tg.BackButton.hide();

    bindData();
  }

  /* ================= УСЛУГА + КАЛЕНДАРЬ ================= */
  function dates(service) {
    var b = deck.booking, out = [], d = new Date(), n = 0;
    d.setDate(d.getDate() + 1);
    while (out.length < 8 && n < 40) {
      if (service.days.indexOf(d.getDay()) >= 0) {
        out.push({ dow: b.dows[d.getDay()], day: d.getDate(), mon: b.months[d.getMonth()],
                   iso: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) });
      }
      d.setDate(d.getDate() + 1); n++;
    }
    return out;
  }

  function renderService() {
    var s = deck.services[sv], b = deck.booking, ds = dates(s), out = '';
    out += '<p class="s-tag">' + esc(s.tag) + '</p>';
    out += '<h1 class="s-title">' + esc(s.title) + '</h1>';
    out += '<div class="s-price"><b>' + esc(s.price) + '</b><span>' + esc(s.duration) + '</span></div>';
    out += '<p class="s-desc">' + esc(s.desc) + '</p>';
    out += '<div class="meta">' + s.meta.map(function (m) {
      return '<div><div class="l">' + esc(m[0]) + '</div><div class="v">' + esc(m[1]) + '</div></div>';
    }).join('') + '</div>';
    out += '<div class="section">ЧТО ВХОДИТ</div><ul class="inc">' +
      s.includes.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>';
    out += '<div class="cut"></div>';
    out += '<p class="cal-label">' + esc(b.kicker) + ' · ' + esc(b.pickDate) + '</p>';
    out += '<div class="days">' + ds.map(function (d, k) {
      return '<button class="day" type="button" data-d="' + k + '" aria-pressed="' +
        (pick.date === d.iso ? 'true' : 'false') + '">' +
        '<i>' + esc(d.dow) + '</i><b>' + d.day + '</b><u>' + esc(d.mon.slice(0, 3)) + '</u></button>';
    }).join('') + '</div>';
    out += '<p class="cal-label">' + esc(b.pickTime) + '</p>';
    out += '<div class="times">' + s.slots.map(function (t) {
      return '<button class="time" type="button" data-t="' + esc(t) + '" aria-pressed="' +
        (pick.time === t ? 'true' : 'false') + '">' + esc(t) + '</button>';
    }).join('') + '</div>';
    out += '<p class="cal-note">' + esc(b.note) + '</p>';

    $('view').innerHTML = out;
    $('scroll').scrollTop = 0;
    $('bars').hidden = true;
    $('where').textContent = s.title;
    $('closeLabel').textContent = 'к списку';
    $('back').hidden = false;
    nav(true);
    $('chan').hidden = true;
    if (tg && tg.BackButton) tg.BackButton.show();
    updateBookButton(ds);

    Array.prototype.forEach.call($('view').querySelectorAll('.day'), function (el) {
      el.onclick = function () {
        pick.date = ds[+el.dataset.d].iso; pick.human = ds[+el.dataset.d];
        haptic('light'); renderService();
      };
    });
    Array.prototype.forEach.call($('view').querySelectorAll('.time'), function (el) {
      el.onclick = function () { pick.time = el.dataset.t; haptic('light'); renderService(); };
    });
  }

  function updateBookButton(ds) {
    var b = deck.booking, ready = pick.date && pick.time;
    $('next').disabled = !ready;
    $('nextLabel').textContent = b.cta;
    $('nextHint').textContent = ready ? (pick.human.day + ' ' + pick.human.mon + ', ' + pick.time) : 'выберите день и время';
  }

  /* ================= РАЗДЕЛЫ ================= */
  function renderMore() {
    var out = '<p class="kicker">' + esc(deck.home.more) + '</p>';
    out += deck.sections.map(function (s, k) {
      return '<button class="item" type="button" data-s="' + k + '">' +
        '<span class="idx">' + pad(k + 1) + '</span>' +
        '<span><span class="t">' + esc(s.title) + '</span>' +
        (s.summary ? '<span class="s">' + esc(s.summary) + '</span>' : '') + '</span>' +
        '<span class="go">›</span></button>';
    }).join('');
    $('view').innerHTML = out;
    $('scroll').scrollTop = 0;
    $('bars').hidden = true;
    $('where').textContent = '';
    $('closeLabel').textContent = 'к списку';
    $('back').hidden = false;
    nav(true);
    $('next').disabled = false;
    $('nextLabel').textContent = deck.home.book;
    $('nextHint').textContent = '';
    $('chan').hidden = true;
    bindData();
  }

  function renderList(list) {
    if (!list || !list.items || !list.items.length) return '';
    return '<ol class="' + (list.style || 'rows') + '">' + list.items.map(function (it, k) {
      return '<li><span class="n">' + pad(k + 1) + '</span><div>' +
        '<div class="t">' + esc(it.title) + '</div>' +
        (it.quote ? '<div class="q">' + esc(it.quote) + '</div>' : '') + '</div></li>';
    }).join('') + '</ol>';
  }

  function renderSlide() {
    var s = sec(), sl = s.slides[i], out = '';
    out += '<p class="kicker">' + pad(i + 1) + ' // ' + esc(sl.kicker || s.title) + '</p>';
    if (sl.title) out += '<h1 class="slide">' + rich(sl.title) + '</h1>';
    if (sl.lead) out += '<p class="lead">' + rich(sl.lead) + '</p>';
    if (sl.meta && sl.meta.length) {
      out += '<div class="meta">' + sl.meta.map(function (m) {
        return '<div><div class="l">' + esc(m.label) + '</div><div class="v">' + esc(m.value) + '</div></div>';
      }).join('') + '</div>';
    }
    if (sl.sectionTitle) out += '<div class="section">' + esc(sl.sectionTitle) + '</div>';
    out += renderList(sl.list);
    if (sl.note) out += '<p class="note">' + rich(sl.note) + '</p>';

    $('view').innerHTML = out;
    $('scroll').scrollTop = 0;
    var bars = '';
    for (var k = 0; k < s.slides.length; k++) {
      bars += '<div class="bar ' + (k < i ? 'done' : k === i ? 'now' : '') + '"></div>';
    }
    $('bars').innerHTML = bars; $('bars').hidden = false;
    $('where').textContent = s.title + ' · ' + pad(i + 1) + '/' + pad(s.slides.length);
    $('closeLabel').textContent = 'к списку';
    $('back').hidden = false;
    nav(true);
    $('next').disabled = false;
    $('chan').hidden = true;
    var last = i === s.slides.length - 1;
    $('nextLabel').textContent = last ? (s.end === 'lead' ? deck.home.book : 'К РАЗДЕЛАМ') : 'ДАЛЬШЕ →';
    $('nextHint').textContent = last ? '' : (s.slides[i + 1].kicker || '');
    seen[s.id + ':' + i] = true;
    send({ action: 'progress', section: s.id, slide: i + 1, total: s.slides.length });
  }

  /* ================= РЕВИЗИЯ РОЛИ ================= */
  function quizIntro() {
    var q = sec(), t = q.intro;
    $('view').innerHTML = '<div class="qz"><p class="kicker">' + esc(t.kicker) + '</p>' +
      '<h1 class="slide">' + rich(t.title) + (t.title2 ? '<br>' + esc(t.title2) : '') + '</h1>' +
      '<p class="lead">' + esc(t.lead) + '</p></div>';
    $('scroll').scrollTop = 0; $('bars').hidden = true;
    $('where').textContent = q.title; $('closeLabel').textContent = 'к списку';
    $('back').hidden = false; nav(true); $('chan').hidden = true; $('next').disabled = false;
    $('nextLabel').textContent = (t.start || 'НАЧАТЬ').toUpperCase();
    $('nextHint').textContent = q.questions.length + ' вопросов';
  }
  function quizQuestion() {
    var q = sec(), item = q.questions[qz.step];
    $('view').innerHTML = '<div class="qz"><p class="kicker">' + pad(qz.step + 1) + ' / ' +
      pad(q.questions.length) + '</p><h2>' + esc(item.q) + '</h2><div class="opts">' +
      item.options.map(function (o, k) {
        return '<button class="opt" type="button" data-a="' + k + '">' + esc(o.l) + '</button>';
      }).join('') + '</div></div>';
    $('scroll').scrollTop = 0;
    var bars = '';
    for (var k = 0; k < q.questions.length; k++) {
      bars += '<div class="bar ' + (k < qz.step ? 'done' : k === qz.step ? 'now' : '') + '"></div>';
    }
    $('bars').innerHTML = bars; $('bars').hidden = false;
    nav(false);
    Array.prototype.forEach.call($('view').querySelectorAll('.opt'), function (b) {
      b.onclick = function () {
        qz.answers[qz.step] = item.options[+b.dataset.a];
        haptic('light'); qz.step++;
        qz.step < q.questions.length ? quizQuestion() : quizResult();
      };
    });
  }
  function quizResult() {
    var q = sec(), r = q.result, hours = 0, score = {};
    qz.answers.forEach(function (a) {
      if (!a) return;
      if (a.t === 'expert') hours += a.h;
      score[a.t] = (score[a.t] || 0) + a.h;
    });
    var order = ['no', 'expert', 'up', 'peers', 'doubt'], best = 'no', top = -1;
    order.forEach(function (t) { if ((score[t] || 0) > top) { top = score[t] || 0; best = t; } });
    var pr = q.profiles[best];
    $('view').innerHTML = '<div class="qz"><p class="kicker">' + esc(r.kicker) + '</p>' +
      '<p class="lead" style="margin-bottom:8px">' + esc(r.hours) + '</p>' +
      '<div class="res-hours"><b>' + hours + '</b><span>' + esc(r.unit) + '</span></div>' +
      '<p class="res-note">' + esc(r.disclaimer) + '</p>' +
      '<div class="section">' + esc(r.profileLabel) + '</div>' +
      '<p class="res-name">' + esc(pr.name) + '</p>' +
      '<p class="lead">' + esc(pr.text) + '</p>' +
      '<div class="section">' + esc(r.stepsLabel) + '</div><ol class="steps">' +
      pr.steps.map(function (x, k) {
        return '<li><span class="n">' + pad(k + 1) + '</span><div><div class="q">' + esc(x) + '</div></div></li>';
      }).join('') + '</ol>' +
      '<button class="gift" type="button" id="gift">' + esc(r.giftLabel).toUpperCase() + '</button></div>';
    $('scroll').scrollTop = 0; $('bars').hidden = true; nav(true);
    $('next').disabled = false;
    $('nextLabel').textContent = (r.bookLabel || 'ЗАПИСАТЬСЯ').toUpperCase();
    $('nextHint').textContent = '';
    send({ action: 'quiz', profile: pr.name, key: best, hours: hours });
    $('gift').onclick = function () {
      haptic('medium');
      var ok = send({ action: 'gift', profile: pr.name });
      if (ok && tg && tg.close) setTimeout(function () { tg.close(); }, 150);
    };
  }
  function quizStep() {
    if (qz.step < 0) return quizIntro();
    if (qz.step < sec().questions.length) return quizQuestion();
    return quizResult();
  }

  /* ================= НАВИГАЦИЯ ================= */
  function bindData() {
    Array.prototype.forEach.call($('view').querySelectorAll('[data-svc]'), function (b) {
      b.onclick = function () { openService(+b.dataset.svc); };
    });
    Array.prototype.forEach.call($('view').querySelectorAll('[data-quiz]'), function (b) {
      b.onclick = function () {
        var k = deck.sections.findIndex(function (x) { return x.type === 'quiz'; });
        if (k >= 0) openSection(k);
      };
    });
    Array.prototype.forEach.call($('view').querySelectorAll('[data-more]'), function (b) {
      b.onclick = function () { view = 'more'; haptic('light'); renderMore(); };
    });
    Array.prototype.forEach.call($('view').querySelectorAll('[data-s]'), function (b) {
      b.onclick = function () { openSection(+b.dataset.s); };
    });
  }
  function openService(k) {
    sv = k; view = 'service'; pick = { date: null, time: null }; haptic('light'); renderService();
  }
  function openSection(k) {
    si = k; i = 0; haptic('light');
    if (deck.sections[k].type === 'quiz') {
      view = 'quiz'; qz = { step: -1, answers: [] };
      if (tg && tg.BackButton) tg.BackButton.show();
      return quizStep();
    }
    view = 'deck'; renderSlide();
  }
  function toHome() { view = 'home'; haptic('light'); nav(true); renderHome(); }
  function go(step) {
    var s = sec(), n = i + step;
    if (n < 0) return toHome();
    if (n >= s.slides.length) return;
    i = n; haptic('light'); renderSlide();
  }
  function book(source, extra) {
    haptic('medium');
    var payload = { action: 'lead', source: source };
    if (extra) Object.keys(extra).forEach(function (k) { payload[k] = extra[k]; });
    var ok = send(payload);
    if (!ok && deck.cta && deck.cta.url) {
      try { tg.openLink(deck.cta.url); } catch (e) { window.open(deck.cta.url, '_blank'); }
      return;
    }
    if (tg && tg.close) setTimeout(function () { tg.close(); }, 150);
  }

  function bind() {
    $('back').onclick = function () {
      if (view === 'service' || view === 'more') return toHome();
      if (view === 'quiz') { qz.step--; return qz.step < -1 ? toHome() : quizStep(); }
      if (view === 'deck') return go(-1);
      return toHome();
    };
    $('next').onclick = function () {
      if (view === 'home' || view === 'more') return book('витрина');
      if (view === 'service') {
        var s = deck.services[sv];
        return book('услуга', { service: s.title, date: pick.human.day + ' ' + pick.human.mon,
                                time: pick.time, price: s.price });
      }
      if (view === 'quiz') {
        if (qz.step < 0) { qz.step = 0; return quizQuestion(); }
        return book('ревизия роли');
      }
      var s2 = sec(), last = i === s2.slides.length - 1;
      if (!last) return go(1);
      return s2.end === 'lead' ? book(s2.id) : toHome();
    };
    $('close').onclick = function () {
      if (view !== 'home') return toHome();
      if (tg && tg.close) tg.close(); else window.close();
    };
    if (tg && tg.BackButton) tg.BackButton.onClick(function () {
      if (view === 'deck') return go(-1);
      if (view !== 'home') return toHome();
      tg.close();
    });
    document.addEventListener('keydown', function (e) {
      if (view !== 'deck') return;
      if (e.key === 'ArrowRight') go(1);
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'Escape') toHome();
    });
  }

  /* ================= ЗАСТАВКА ================= */
  function splash(done) {
    var sp = deck.splash || {};
    $('spTitle').textContent = sp.title || 'HUMAN';
    $('spSub').textContent = sp.sub || '';
    $('spLine').textContent = sp.line || '';
    $('spSkip').textContent = sp.skip || 'пропустить';
    var el = $('splash'), gone = false;
    function hide() {
      if (gone) return; gone = true;
      el.classList.add('out');
      setTimeout(function () { el.style.display = 'none'; done(); }, 420);
    }
    $('spSkip').onclick = hide;
    el.onclick = hide;
    setTimeout(hide, 2600);
  }

  function boot(data) {
    deck = data;
    document.title = (deck.brand && deck.brand.name) || 'HUMAN';
    $('foot').textContent = (deck.brand && deck.brand.botUsername) || '';
    if (deck.brand && deck.brand.channel) {
      $('chan').href = deck.brand.channel;
      $('chan').textContent = deck.home.channel || 'КАНАЛ';
    }
    bind();
    renderHome();
    var want = new URLSearchParams(location.search).get('section') ||
               (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
    var svk = deck.services.findIndex(function (x) { return x.id === want; });
    var sk = deck.sections.findIndex(function (x) { return x.id === want; });
    var noSplash = new URLSearchParams(location.search).get('splash') === '0';
    function after() {
      if (svk >= 0) return openService(svk);
      if (sk >= 0) return openSection(sk);
    }
    noSplash ? ($('splash').style.display = 'none', after()) : splash(after);
  }

  fetch(new URLSearchParams(location.search).get('content') || '../content.json', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(boot)
    .catch(function () {
      $('splash').style.display = 'none';
      $('view').innerHTML = '<p class="lead">контент не загрузился. откройте страницу через http-сервер.</p>';
    });
})();
</script>
</body>
</html>
