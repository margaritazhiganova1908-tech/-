  .orange { fill: #ea8d3f; }

  .food   { fill: var(--pink); stroke: var(--pink-line); stroke-width: 1.71; }
  .flabel { fill: var(--pink-ink); font-size: 11.53px; font-weight: 800; letter-spacing: .08em; }
  .rlabel { fill: var(--ink2); font-size: 12.81px; font-weight: 700; letter-spacing: .14em; }
  .rname  { fill: var(--ink); font-size: 21.34px; font-weight: 800; letter-spacing: .02em; }
  .arrow  { stroke: var(--ink); stroke-width: 3.84; }
  .arrowhead { fill: var(--ink); }
  .entry  { fill: var(--ink); font-size: 15.37px; font-weight: 800; letter-spacing: .08em; }
  .dim    { stroke: #8b8b92; stroke-width: 0.64; }
  .ext    { stroke: #b4b4ba; stroke-width: 0.51; }
  .tick   { stroke: var(--ink2); stroke-width: 1.28; }
  .dimt   { fill: var(--ink2); font-size: 9.82px; font-weight: 500; }
  .small  { fill: var(--ink2); font-size: 8.96px; }
  .sb1 { fill: var(--ink); stroke: var(--ink); stroke-width: 0.64; }
  .sb0 { fill: #fff; stroke: var(--ink); stroke-width: 0.64; }
  .sbt { fill: var(--ink2); font-size: 8.11px; }

  .strip { display: grid; grid-template-columns: 1.3fr 1fr 1.3fr 1fr 0.8fr; border: 0.4mm solid var(--ink); height: 15mm; }
  .strip .cell { border-right: 0.2mm solid var(--line); padding: 1.8mm 3mm; display: flex; flex-direction: column; justify-content: space-between; }
  .strip .cell span { font-size: 2.5mm; color: var(--muted); }
  .strip .cell.dark { background: var(--ink); border-right: 0; color: #fff; }
  .strip .cell.dark b { font-size: 3mm; letter-spacing: .06em; }
  .strip .cell.dark span { color: #c9c9ce; }
</style>
